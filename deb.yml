              register: r_popups
              changed_when: "'CHANGED' in r_popups.stdout"

            # ================ 15. automatic updates: system, apps, firmware ================
            - name: Update tools (unattended-upgrades, fwupd, zenity, curl, wget)
              ansible.builtin.apt:
                name: [unattended-upgrades, fwupd, zenity, curl, wget]
                state: present
                lock_timeout: 600

            - name: System updates every 6 hours (settings)
              ansible.builtin.copy:
                dest: "{{ item.dest }}"
                mode: "0644"
                content: "{{ item.content }}"
              loop:
                - dest: /etc/apt/apt.conf.d/20auto-upgrades
                  content: !unsafe |
                    APT::Periodic::Update-Package-Lists "1";
                    APT::Periodic::Download-Upgradeable-Packages "1";
                    APT::Periodic::Unattended-Upgrade "1";
                    APT::Periodic::AutocleanInterval "7";
                - dest: /etc/apt/apt.conf.d/52custom-unattended-upgrades
                  content: !unsafe |
                    // Update packages ONLY from these repositories (not from any repo added later):
                    // Ubuntu (security + normal updates), Chrome, VS Code, Firefox (Mozilla), OnlyOffice
                    Unattended-Upgrade::Origins-Pattern {
                            "origin=Ubuntu,archive=${distro_codename}-security";
                            "origin=Ubuntu,archive=${distro_codename}-updates";
                            "origin=UbuntuESMApps,archive=${distro_codename}-apps-security";
                            "origin=UbuntuESM,archive=${distro_codename}-infra-security";
                            "site=dl.google.com";
                            "site=packages.microsoft.com";
