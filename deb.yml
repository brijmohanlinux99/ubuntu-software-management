                fi
                [ "$before" = "$(md5sum /etc/adduser.conf)" ] || echo CHANGED
              register: r_adduser
              changed_when: "'CHANGED' in r_adduser.stdout"

            - name: Add every user to netdev, dialout, wireshark now
              ansible.builtin.command: /usr/local/sbin/netdev-sync
              register: r_groups
              changed_when: "'added' in r_groups.stdout"

            # ================ 14. no update pop-ups ================
