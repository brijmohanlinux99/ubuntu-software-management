                    Unattended-Upgrade::Automatic-Reboot "false";
              loop_control:
                label: "{{ item.dest }}"
              register: r_aptcfg

            - name: Update check times (00, 06, 12, 18 h)
              ansible.builtin.copy:
                dest: "/etc/systemd/system/{{ item }}.timer.d/override.conf"
                mode: "0644"
                content: !unsafe |
                  [Timer]
                  OnCalendar=
                  OnCalendar=*-*-* 00,06,12,18:00
                  RandomizedDelaySec=30m
                  Persistent=true
              loop: [apt-daily, apt-daily-upgrade]
              register: r_apt_timers

            - name: Download helpers for app updates
              ansible.builtin.copy:
                dest: "{{ item.dest }}"
                mode: "{{ item.mode }}"
                content: "{{ item.content }}"
              loop:
                - dest: /usr/local/lib/app-update-fp.sh
                  mode: "0644"
                  content: !unsafe |
                    # Shared download helpers (setup script, weekly app updater, Telegram updater).
                    # Some ISPs block GitHub's file servers (*.githubusercontent.com) via DNS; then a
                    # download is retried with DNS-over-HTTPS (Cloudflare, then Google).
                    DOH_SERVERS="https://cloudflare-dns.com/dns-query https://dns.google/dns-query"
                    dl_file() {   # dl_file URL OUTPUT  -> 0 if downloaded (non-empty)
                      local url="$1" out="$2" doh
                      rm -f "$out"
                      wget -q --tries=2 --timeout=60 -O "$out" "$url" 2>/dev/null && [ -s "$out" ] && return 0
                      for doh in $DOH_SERVERS; do
                        curl -fsSL --retry 2 --connect-timeout 20 --max-time 900 --doh-url "$doh" -o "$out" "$url" 2>/dev/null \
                          && [ -s "$out" ] && return 0
                      done
                      rm -f "$out"; return 1
                    }
                    # Remembers a fingerprint (final URL without its time-limited signature + ETag +
                    # Last-Modified + size) per download URL, so the weekly updater downloads a file
                    # only when it really changed.
                    FP_DIR=/var/lib/app-auto-update
                    remote_fp() {
                      local h doh
                      h=$(curl -fsSIL --max-time 30 -w 'URL:%{url_effective}\n' "$1" 2>/dev/null) || h=""
                      if [ -z "$h" ]; then
                        for doh in $DOH_SERVERS; do
                          h=$(curl -fsSIL --max-time 30 --doh-url "$doh" -w 'URL:%{url_effective}\n' "$1" 2>/dev/null) && break
                        done
                      fi
                      [ -n "$h" ] || return 1
                      printf '%s\n' "$h" | tr -d '\r' | sed -E 's/^(URL:[^?]*)\?.*/\1/' \
                        | grep -iE '^(etag|last-modified|content-length|URL):' | sort | md5sum | cut -d' ' -f1
                    }
                    fp_key()  { printf '%s' "$1" | md5sum | cut -d' ' -f1; }
                    fp_changed() {   # true = changed or unknown -> download
                      local new old
                      new=$(remote_fp "$1") || return 0
                      old=$(cat "$FP_DIR/$(fp_key "$1")" 2>/dev/null)
                      [ "$new" != "$old" ]
                    }
                    fp_save() {
                      local new
                      new=$(remote_fp "$1") || return 0
                      mkdir -p "$FP_DIR"; printf '%s\n' "$new" > "$FP_DIR/$(fp_key "$1")"
                    }
                - dest: /usr/local/sbin/telegram-install-update
                  mode: "0755"
                  content: !unsafe |
                    #!/bin/bash
                    # Installs or updates official Telegram Desktop in /opt/Telegram.
                    # Sources: telegram.org, fallback Telegram's official GitHub releases.
                    # Only replaces the old version after the new one unpacked successfully.
                    DEST="${TG_DEST:-/opt/Telegram}"
                    LINK="${TG_LINK:-/usr/local/bin/telegram}"
                    WORK=/var/cache/telegram-update
                    mkdir -p "$WORK"

                    tg_version() {   # file name -> version (works for tsetup.X.tar.xz and td-setup-linux-x64-X.tar.xz)
                      basename "$1" | sed -E 's/\.tar\.xz$//' | grep -oE '[0-9]+(\.[0-9]+)+' | tail -n1
                    }
                    resolve_source() {   # prints: URL VERSION
                      local real ver tag file
                      real=$(curl -fsSL --max-time 60 -r 0-0 -o /dev/null -w '%{url_effective}' \
                             https://telegram.org/dl/desktop/linux 2>/dev/null)
                      if [[ "$real" == *.tar.xz ]]; then
                        ver=$(tg_version "$real"); echo "$real ${ver:-unknown}"; return 0
                      fi
                      tag=$(curl -s --max-time 60 -o /dev/null -w '%{redirect_url}' \
                            https://github.com/telegramdesktop/tdesktop/releases/latest | sed 's#.*/tag/##')
                      [ -n "$tag" ] || return 1
                      file=$(curl -fsSL --max-time 60 "https://github.com/telegramdesktop/tdesktop/releases/expanded_assets/$tag" \
                             | grep -oE '/telegramdesktop/tdesktop/releases/download/[^"]+linux[^"]*\.tar\.xz' | head -n1)
                      [ -n "$file" ] || return 1
                      echo "https://github.com$file $(tg_version "$file")"
                    }

                    [ "${1:-}" = "--check" ] && { resolve_source; exit $?; }

                    read -r URL NEW < <(resolve_source) || true
                    [ -n "${URL:-}" ] || { echo "Telegram: no download source reachable (telegram.org and GitHub)"; exit 1; }
                    CUR=$(cat "$DEST/.version" 2>/dev/null)
                    mark_system_updated() {   # Telegram then skips its own updater and extra per-user launcher
                      [ -d "$DEST" ] || return 0
                      mkdir -p "$DEST/externalupdater.d"
                      echo "$DEST/Telegram" > "$DEST/externalupdater.d/system"
                    }
                    if [ -x "$DEST/Telegram" ] && [ "$NEW" != "unknown" ] && [ "$NEW" = "$CUR" ]; then
                      mark_system_updated
                      echo "Telegram: up to date ($CUR)"; exit 0
                    fi
                    rm -rf "${WORK:?}"/*
                    [ -f /usr/local/lib/app-update-fp.sh ] && . /usr/local/lib/app-update-fp.sh
                    if type dl_file >/dev/null 2>&1; then dl_file "$URL" "$WORK/telegram.tar.xz"
                    else wget -q --tries=3 --timeout=120 -O "$WORK/telegram.tar.xz" "$URL"; fi \
                      || { echo "Telegram: download failed ($URL)"; exit 1; }
                    mkdir -p "$WORK/new" && tar -xJf "$WORK/telegram.tar.xz" -C "$WORK/new" || { echo "Telegram: unpack failed"; exit 1; }
                    [ -x "$WORK/new/Telegram/Telegram" ] || { echo "Telegram: unexpected archive layout"; exit 1; }
                    rm -rf "$DEST.old"; [ -d "$DEST" ] && mv "$DEST" "$DEST.old"
                    mv "$WORK/new/Telegram" "$DEST" && rm -rf "$DEST.old"
                    echo "$NEW" > "$DEST/.version"
                    mark_system_updated
                    chown -R root:root "$DEST"; chmod -R go-w "$DEST"   # read-only for users: disables self-updater
                    ln -sf "$DEST/Telegram" "$LINK"
                    rm -rf "${WORK:?}"/*
                    echo "Telegram: installed $NEW (was ${CUR:-none}) from $URL"
              loop_control:
                label: "{{ item.dest }}"

            - name: App updater (never replaces an app that is open)
              ansible.builtin.copy:
                dest: /usr/local/sbin/app-auto-update
                mode: "0755"
                content: !unsafe |
                  #!/bin/bash
                  # Updates apps that have no apt repository (Zoom, Slack, Viber, OnlyOffice,
                  # RustDesk, LocalSend, Tabby, WhatsApp, Telegram, OmaCal, WinBox). Only installs a NEWER version.
                  # Never replaces an app while it is open (e.g. Zoom during a call): it is updated on a
                  # later run (daily 07:15 + 12:00 and after boot) when the app is closed.
                  export DEBIAN_FRONTEND=noninteractive
                  LOG=/var/log/app-auto-update.log
                  CACHE=/var/cache/app-auto-update
                  mkdir -p "$CACHE"
                  exec >>"$LOG" 2>&1
                  echo "=== $(date '+%Y-%m-%d %H:%M') ==="
                  . /usr/local/lib/app-update-fp.sh

                  app_running() {   # app_running PACKAGE -> 0 if the app is open right now
                    case "$1" in
                      zoom) pgrep -x zoom ;;
                      viber) pgrep -x Viber ;;
                      onlyoffice-desktopeditors) pgrep -x DesktopEditors ;;
                      rustdesk) pgrep -f 'rustdesk --cm' ;;          # a remote session is open (the service itself is ignored)
                      slack-desktop|slack) pgrep -x slack ;;
                      tabby-terminal|tabby) pgrep -x tabby ;;
                      localsend*) pgrep -f localsend ;;
                      wasistlos) pgrep -x wasistlos ;;
                      omacal) pgrep -x omacal ;;
                      winbox) pgrep -if winbox ;;
                      *) pgrep -x "$1" ;;
                    esac >/dev/null 2>&1
                  }

                  update_from_url() {
                    local url="$1" f="$CACHE/upd.deb" pkg newv cur
                    [ -n "$url" ] || return 0
                    if ! fp_changed "$url"; then echo "unchanged, not downloaded: $(basename "$url")"; return 0; fi
                    dl_file "$url" "$f" || { echo "download failed: $url"; return 0; }
                    pkg=$(dpkg-deb -f "$f" Package 2>/dev/null); newv=$(dpkg-deb -f "$f" Version 2>/dev/null)
                    if [ -z "$pkg" ]; then echo "not a .deb: $url"; rm -f "$f"; return 0; fi
                    if ! dpkg-query -W -f='${Status}' "$pkg" 2>/dev/null | grep -q "install ok installed"; then
                      echo "$pkg: not installed, skipped"; rm -f "$f"; return 0
                    fi
                    cur=$(dpkg-query -W -f='${Version}' "$pkg")
                    if dpkg --compare-versions "$newv" gt "$cur" && app_running "$pkg"; then
                      echo "$pkg: $newv available but the app is open - will update on a later run"
                      rm -f "$f"; return 0                          # no fp_save: try again next run
                    elif dpkg --compare-versions "$newv" gt "$cur"; then
                      apt-get install -y -o Dpkg::Options::=--force-confold "$f" && echo "$pkg: updated $cur -> $newv"
                    else
                      echo "$pkg: up to date ($cur)"
                    fi
                    fp_save "$url"
                    rm -f "$f"
                  }
                  winbox_url() {   # newest stable WinBox 4 .deb (tikoci/winbox-deb, packages MikroTik's official WinBox)
                    local tag f
                    tag=$(curl -s --max-time 60 -o /dev/null -w '%{redirect_url}' https://github.com/tikoci/winbox-deb/releases/latest | sed 's#.*/tag/##')
                    if [ -n "$tag" ]; then
                      f=$(curl -fsSL --max-time 60 "https://github.com/tikoci/winbox-deb/releases/expanded_assets/$tag" 2>/dev/null \
                          | grep -oE '/tikoci/winbox-deb/releases/download/[^"]+/WinBox-[0-9][^"/]*\.deb' | head -n1)
                      [ -n "$f" ] && { echo "https://github.com$f"; return 0; }
                    fi
                    echo "https://github.com/tikoci/winbox-deb/releases/download/4.0.1/WinBox-4.0.1.deb"
                  }
                  omacal_url() {   # newest OmaCal .deb (official x3me/omacal releases, github.com only, no API)
                    local tag f
                    tag=$(curl -s --max-time 60 -o /dev/null -w '%{redirect_url}' https://github.com/x3me/omacal/releases/latest | sed 's#.*/tag/##')
                    if [ -n "$tag" ]; then
                      f=$(curl -fsSL --max-time 60 "https://github.com/x3me/omacal/releases/expanded_assets/$tag" 2>/dev/null \
                          | grep -oE '/x3me/omacal/releases/download/[^"]+/omacal_[0-9][^"/]*_amd64\.deb' | head -n1)
                      [ -n "$f" ] && { echo "https://github.com$f"; return 0; }
                    fi
                    echo "https://github.com/x3me/omacal/releases/latest/download/omacal_amd64.deb"
                  }
                  gh_url() {
                    curl -fsSL --max-time 60 "https://api.github.com/repos/$1/releases/latest" 2>/dev/null \
                      | grep -oE "https://[^\"]+$2" | head -n1
                  }

                  update_from_url "https://zoom.us/client/latest/zoom_amd64.deb"
                  update_from_url "https://download.cdn.viber.com/cdn/desktop/Linux/viber.deb"
                  update_from_url "https://download.onlyoffice.com/install/desktop/editors/linux/onlyoffice-desktopeditors_amd64.deb"
                  update_from_url "$(gh_url rustdesk/rustdesk 'x86_64\.deb')"
                  update_from_url "$(gh_url localsend/localsend 'linux-x86-64\.deb')"
                  update_from_url "$(gh_url Eugeny/tabby 'linux-x64\.deb')"

                  SV=$(curl -fsSL --max-time 60 https://slack.com/release-notes/linux 2>/dev/null \
                       | grep -oE 'Slack [0-9]+\.[0-9]+\.[0-9]+' | head -n1 | awk '{print $2}')
                  [ -n "$SV" ] && update_from_url "https://downloads.slack-edge.com/desktop-releases/linux/x64/$SV/slack-desktop-$SV-amd64.deb"

                  WA=$(curl -fsSL --max-time 60 http://deb.debian.org/debian/pool/main/w/wasistlos/ 2>/dev/null \
                       | grep -oE 'wasistlos_[^"<>]+_amd64\.deb' | sort -uV | tail -n1)
                  [ -n "$WA" ] && update_from_url "http://deb.debian.org/debian/pool/main/w/wasistlos/$WA"
                  for f in /usr/share/applications/*[Ww]as[Ii]st[Ll]os*.desktop; do
                    [ -f "$f" ] && sed -i 's/^Name=.*/Name=WhatsApp/' "$f"
                  done
                  dpkg -s omacal >/dev/null 2>&1 && update_from_url "$(omacal_url)"
                  dpkg -s winbox >/dev/null 2>&1 && update_from_url "$(winbox_url)"
                  if [ -x /usr/local/bin/starship ]; then
                    st_new=$(curl -s --max-time 60 -o /dev/null -w '%{redirect_url}' https://github.com/starship/starship/releases/latest | sed 's#.*/tag/v##')
                    st_cur=$(/usr/local/bin/starship --version 2>/dev/null | awk 'NR==1{print $2}')
                    if [ -n "$st_new" ] && [ "$st_new" != "$st_cur" ]; then
                      if dl_file "https://github.com/starship/starship/releases/download/v$st_new/starship-x86_64-unknown-linux-gnu.tar.gz" "$CACHE/starship.tgz" \
                         && tar -xzf "$CACHE/starship.tgz" -C /usr/local/bin starship; then
                        chmod 755 /usr/local/bin/starship; echo "starship: updated $st_cur -> $st_new"
                      fi
                      rm -f "$CACHE/starship.tgz"
                    else
                      echo "starship: up to date (${st_cur:-?})"
                    fi
                  fi
                  [ -x /usr/local/sbin/telegram-install-update ] && [ -d /opt/Telegram ] && /usr/local/sbin/telegram-install-update
                  exit 0

            - name: Firmware updater (weekly, charger only, installs at the next restart)
              ansible.builtin.copy:
                dest: /usr/local/sbin/firmware-auto-update
                mode: "0755"
                content: !unsafe |
                  #!/bin/bash
                  # Installs firmware updates from LVFS. Safety: only on charger power and
                  # battery >= 40%. BIOS updates are applied at the next reboot.
                  LOG=/var/log/firmware-auto-update.log
                  exec >>"$LOG" 2>&1
                  echo "=== $(date '+%Y-%m-%d %H:%M') ==="
                  AC="unknown"
                  for ps in /sys/class/power_supply/*; do
                    [ "$(cat "$ps/type" 2>/dev/null)" = "Mains" ] && AC=$(cat "$ps/online" 2>/dev/null)
                  done
                  if [ "$AC" = "0" ]; then echo "On battery - skipped"; exit 0; fi
                  BAT=$(cat /sys/class/power_supply/BAT*/capacity 2>/dev/null | head -n1)
                  if [ -n "$BAT" ] && [ "$BAT" -lt 40 ]; then echo "Battery $BAT% - skipped"; exit 0; fi
                  fwupdmgr refresh --force >/dev/null 2>&1 || true
                  if fwupdmgr get-updates --no-unreported-check >/dev/null 2>&1; then
                    fwupdmgr update -y --no-reboot-check --no-unreported-check && \
                      echo "Firmware updated - will finish at next reboot if needed"
                  else
                    echo "No firmware updates"
                  fi
                  exit 0

            - name: update-status command (anyone can see that updates work)
              ansible.builtin.copy:
                dest: /usr/local/bin/update-status
                mode: "0755"
                content: !unsafe |
                  #!/bin/bash
                  echo "=== Automatic updates status ==="
                  echo "Next system update check:"
                  systemctl list-timers apt-daily-upgrade.timer --no-pager 2>/dev/null | sed -n 2p
                  echo "Next app update:      $(systemctl list-timers app-auto-update.timer --no-pager 2>/dev/null | sed -n 2p | awk '{print $1,$2,$3}')"
                  echo "Next firmware check:  $(systemctl list-timers firmware-auto-update.timer --no-pager 2>/dev/null | sed -n 2p | awk '{print $1,$2,$3}')"
                  echo
                  echo "Last system update:   $(ls -l --time-style=+'%Y-%m-%d %H:%M' /var/lib/apt/periodic/upgrade-stamp 2>/dev/null | awk '{print $6,$7}')"
                  echo
                  echo "--- Last app updates ---";      tail -n 12 /var/log/app-auto-update.log 2>/dev/null || echo "none yet"
                  echo "--- Last firmware check ---";   tail -n 4 /var/log/firmware-auto-update.log 2>/dev/null || echo "none yet"
                  echo
                  if [ -f /etc/default/firstboot-apps ]; then
                    echo "--- Apps installed after first boot ---"
                    if [ -f /var/lib/custom-iso/firstboot-apps.done ]; then echo "all installed ($(cat /var/lib/custom-iso/firstboot-apps.done))"
                    else echo "still installing / waiting for internet:"; tail -n 6 /var/log/firstboot-apps.log 2>/dev/null; fi
                    echo
                  fi
                  [ -f /var/run/reboot-required ] && echo "!! Restart the laptop to finish installing updates." || echo "No restart needed."

            - name: App and firmware update services and timers
              ansible.builtin.copy:
                dest: "/etc/systemd/system/{{ item.name }}"
                mode: "0644"
                content: "{{ item.content }}"
              loop:
                - name: app-auto-update.service
                  content: !unsafe |
                    [Unit]
                    Description=Update apps installed from .deb files (Zoom, Slack, Viber ...)
                    After=network-online.target
                    Wants=network-online.target

                    [Service]
                    Type=oneshot
                    ExecStart=/usr/local/sbin/app-auto-update
                    Nice=19
                    IOSchedulingClass=idle
                - name: app-auto-update.timer
                  content: !unsafe |
                    [Unit]
                    Description=Update apps without a repository (daily; skips apps that are open)

                    [Timer]
                    OnBootSec=5min
                    OnCalendar=*-*-* 07:15:00
                    OnCalendar=*-*-* 12:00:00
                    RandomizedDelaySec=15min
                    Persistent=true

                    [Install]
                    WantedBy=timers.target
                - name: firmware-auto-update.service
                  content: !unsafe |
                    [Unit]
                    Description=Automatic firmware update (fwupd)
                    After=network-online.target fwupd.service
                    Wants=network-online.target

                    [Service]
                    Type=oneshot
                    ExecStart=/usr/local/sbin/firmware-auto-update
                - name: firmware-auto-update.timer
                  content: !unsafe |
                    [Unit]
                    Description=Weekly firmware update check

                    [Timer]
                    OnCalendar=Wed *-*-* 13:00:00
                    RandomizedDelaySec=1h
                    Persistent=true

                    [Install]
                    WantedBy=timers.target
              loop_control:
                label: "{{ item.name }}"

            - name: Update logs readable by everyone
              ansible.builtin.file:
                path: "{{ item }}"
                state: touch
                mode: "0644"
                modification_time: preserve
                access_time: preserve
              loop: [/var/log/app-auto-update.log, /var/log/firmware-auto-update.log]

            - name: Automatic updates on
              ansible.builtin.systemd:
                name: "{{ item }}"
                enabled: true
                state: started
                daemon_reload: true
              loop: [unattended-upgrades.service, apt-daily.timer, apt-daily-upgrade.timer, app-auto-update.timer, firmware-auto-update.timer]

            - name: Firmware list refresh on
              ansible.builtin.systemd:
                name: fwupd-refresh.timer
                enabled: true
              failed_when: false

            - name: Apply new update check times now
              ansible.builtin.command: systemctl restart apt-daily.timer apt-daily-upgrade.timer
              when: r_apt_timers.changed
              changed_when: true

            # ================ 16. restart twice a week (Sun + Thu 07:00), notices, 7-day logs ================
            - name: Maintenance settings (an existing file is kept)
              ansible.builtin.copy:
                dest: /etc/default/excitel-maintenance
                mode: "0644"
                force: false
                content: !unsafe |
                  # Excitel maintenance settings (applied with: sudo excitel-maintenance apply)
                  REBOOT_DAYS="Sun,Thu"        # scheduled restart days
                  REBOOT_TIME="07:00"          # outside working hours
                  WORK_START=8                 # working hours start (hour)
                  WORK_END=22                  # working hours end (hour)
                  WARN_MINUTES=5               # warning before a restart outside working hours
                  CATCHUP_WARN_MINUTES=15      # warning before a missed restart during working hours
                  POSTPONE_MINUTES=60          # "Postpone 1 hour" button
                  MIN_UPTIME_HOURS=12          # skip if the laptop was restarted recently

            - name: Maintenance folders
              ansible.builtin.file:
                path: "{{ item.path }}"
                state: directory
                owner: root
                group: "{{ item.group }}"
                mode: "{{ item.mode }}"
              loop:
                - { path: /var/log/excitel, group: adm, mode: "0750" }
                - { path: /var/lib/excitel-notice, group: root, mode: "0755" }
                - { path: /usr/lib/systemd/system-sleep, group: root, mode: "0755" }

            - name: Maintenance tools (notices, restarts, logs)
              ansible.builtin.copy:
                dest: "{{ item.dest }}"
                mode: "{{ item.mode }}"
                content: "{{ item.content }}"
              loop:
                - dest: /usr/local/sbin/excitel-notify
                  mode: "0755"
                  content: !unsafe |
                    #!/bin/bash
                    # excitel-notify users                  -> list active desktop users (exit 1 if none)
                    # excitel-notify info TITLE BODY        -> desktop notification for every active user
                    # excitel-notify run COMMAND...        -> start COMMAND in every active desktop session
                    # excitel-notify ask TITLE BODY SECONDS -> dialog [Restart now] [Postpone 1 hour];
                    #                                         exit 10 = postponed, 0 = restart (or timeout)
                    sessions() {   # prints: user uid display home
                      local s user type active class disp uid home
                      for s in $(loginctl list-sessions --no-legend 2>/dev/null | awk '{print $1}'); do
                        class=$(loginctl show-session "$s" -p Class --value 2>/dev/null)
                        active=$(loginctl show-session "$s" -p Active --value 2>/dev/null)
                        type=$(loginctl show-session "$s" -p Type --value 2>/dev/null)
                        [ "$class" = "user" ] && [ "$active" = "yes" ] || continue
                        case "$type" in x11|wayland) ;; *) continue ;; esac
                        user=$(loginctl show-session "$s" -p Name --value 2>/dev/null)
                        disp=$(loginctl show-session "$s" -p Display --value 2>/dev/null)
                        uid=$(id -u "$user" 2>/dev/null) || continue
                        home=$(getent passwd "$user" | cut -d: -f6)
                        echo "$user $uid ${disp:-:0} $home"
                      done | sort -u
                    }
                    as_user() {   # $1 user $2 uid $3 display $4 home, then command
                      local u="$1" uid="$2" d="$3" h="$4"; shift 4
                      runuser -u "$u" -- env HOME="$h" USER="$u" DISPLAY="$d" XAUTHORITY="$h/.Xauthority" \
                        XDG_RUNTIME_DIR="/run/user/$uid" XDG_CURRENT_DESKTOP="X-Cinnamon" \
                        DBUS_SESSION_BUS_ADDRESS="unix:path=/run/user/$uid/bus" "$@"
                    }
                    case "${1:-}" in
                      users)
                        out=$(sessions | awk '{print $1}' | tr '\n' ' ' | sed 's/ $//')
                        [ -n "$out" ] && { echo "$out"; exit 0; } || exit 1 ;;
                      info)
                        sessions | while read -r u uid d h; do
                          as_user "$u" "$uid" "$d" "$h" notify-send -a "Excitel IT" -i system-software-update -u normal "$2" "$3" 2>/dev/null &
                        done; wait; exit 0 ;;
                      run)
                        shift
                        sessions | while read -r u uid d h; do
                          as_user "$u" "$uid" "$d" "$h" setsid -f "$@" >/dev/null 2>&1 < /dev/null
                        done; exit 0 ;;
                      ask)
                        read -r u uid d h < <(sessions | head -n1)
                        [ -n "${u:-}" ] || exit 2
                        if command -v zenity >/dev/null; then
                          as_user "$u" "$uid" "$d" "$h" zenity --question --title="$2" --text="$3" \
                            --ok-label="Restart now" --cancel-label="Postpone 1 hour" --timeout="$4" --width=440 2>/dev/null
                          rc=$?
                          [ "$rc" -eq 1 ] && exit 10      # Postpone pressed (or dialog closed)
                          exit 0                          # Restart now, or timeout
                        fi
                        as_user "$u" "$uid" "$d" "$h" notify-send -a "Excitel IT" -u critical "$2" "$3" 2>/dev/null
                        sleep "$4"; exit 0 ;;
                      *) echo "usage: excitel-notify users | info TITLE BODY | run COMMAND | ask TITLE BODY SECONDS"; exit 1 ;;
                    esac
                - dest: /usr/local/bin/ensure-nemo-desktop
                  mode: "0755"
                  content: !unsafe |
                    #!/bin/bash
                    # ensure-nemo-desktop          -> start the desktop icons (nemo-desktop) if they stopped
                    # ensure-nemo-desktop --watch  -> check every 2 minutes during this login session
                    check() {
                      local uid layout
                      uid=$(id -u)
                      pgrep -u "$uid" -x cinnamon >/dev/null || return 0               # no Cinnamon desktop (yet)
                      layout=$(gsettings get org.nemo.desktop desktop-layout 2>/dev/null)
                      layout=${layout//\'/}
                      [ "${layout%%:*}" = "false" ] && return 0                        # desktop icons switched off
                      pgrep -u "$uid" -x nemo-desktop >/dev/null && return 0           # running - nothing to do
                      setsid -f nemo-desktop >/dev/null 2>&1 < /dev/null
                      logger -t ensure-nemo-desktop "desktop icons (nemo-desktop) were not running for ${USER:-$(id -un)} - started again"
                    }
                    if [ "${1:-}" = "--watch" ]; then
                      LOCK="${XDG_RUNTIME_DIR:-/tmp}/ensure-nemo-desktop.lock"
                      exec 9>"$LOCK"
                      flock -n 9 || exit 0                                             # one watcher per session
                      sleep 45                                                         # Cinnamon starts it itself first
                      while [ -e "$LOCK" ]; do check; sleep 120; done                  # ends when the user logs out
                      exit 0
                    fi
                    check
                - dest: /etc/xdg/autostart/ensure-nemo-desktop.desktop
                  mode: "0644"
                  content: !unsafe |
                    [Desktop Entry]
                    Type=Application
                    Name=Desktop icons check
                    Exec=/usr/local/bin/ensure-nemo-desktop --watch
                    OnlyShowIn=X-Cinnamon;
                    NoDisplay=true
                    X-GNOME-Autostart-enabled=true
                - dest: /etc/apt/apt.conf.d/99ensure-nemo-desktop
                  mode: "0644"
                  content: !unsafe |
                    DPkg::Post-Invoke { "[ -x /usr/local/sbin/excitel-notify ] && systemd-run --quiet --collect --on-active=20s /usr/local/sbin/excitel-notify run /usr/local/bin/ensure-nemo-desktop >/dev/null 2>&1 || true"; };
                - dest: /usr/local/sbin/excitel-reboot
                  mode: "0755"
                  content: !unsafe |
                    #!/bin/bash
                    # excitel-reboot scheduled   (Sun+Thu 7:00, wakes the laptop from sleep)
                    # excitel-reboot required    (daily 7:00: only if a security update needs a restart)
                    # excitel-reboot catchup     (after resume, if a restart was skipped in a bag; outside working
                    #                             hours only - otherwise the next 7:00 'required' run does it)
                    # excitel-reboot postponed   (1 hour after "Postpone")
                    . /etc/default/excitel-maintenance 2>/dev/null
                    WORK_START=${WORK_START:-8}; WORK_END=${WORK_END:-22}; WARN_MINUTES=${WARN_MINUTES:-5}
                    CATCHUP_WARN_MINUTES=${CATCHUP_WARN_MINUTES:-15}; POSTPONE_MINUTES=${POSTPONE_MINUTES:-60}
                    MIN_UPTIME_HOURS=${MIN_UPTIME_HOURS:-12}; REBOOT_DAYS=${REBOOT_DAYS:-Sun,Thu}
                    MODE="${1:-scheduled}"
                    /usr/local/sbin/not-live-session || exit 0
                    ST=/var/lib/custom-iso; NOTE=/var/lib/excitel-notice; mkdir -p "$ST" "$NOTE" /var/log/excitel
                    LOG="/var/log/excitel/reboot-$(date +%F).log"
                    log() { echo "$(date '+%F %T') [$MODE] $*" >> "$LOG"; }
                    up=$(cut -d. -f1 /proc/uptime); hour=$(date +%-H)
                    in_work_hours() { [ "$hour" -ge "$WORK_START" ] && [ "$hour" -lt "$WORK_END" ]; }
                    on_ac() {
                      local p bat=0
                      for p in /sys/class/power_supply/*; do
                        [ "$(cat "$p/type" 2>/dev/null)" = "Battery" ] && bat=1
                        [ "$(cat "$p/type" 2>/dev/null)" = "Mains" ] && [ "$(cat "$p/online" 2>/dev/null)" = "1" ] && return 0
                      done
                      [ "$bat" = 0 ]          # no battery (desktop/VM) counts as power connected
                    }
                    lid_closed() { grep -qs closed /proc/acpi/button/lid/*/state; }

                    case "$MODE" in
                      required)
                        [ -f /run/reboot-required ] || [ -f "$ST/reboot-pending" ] || exit 0
                        [[ ",$REBOOT_DAYS," == *",$(LC_ALL=C date +%a),"* ]] && exit 0     # scheduled restart today anyway
                        if in_work_hours; then log "restart needed - waiting for the next morning (working hours)"; exit 0; fi ;;
                      catchup)  [ -f "$ST/reboot-pending" ] || exit 0
                        if in_work_hours; then log "skipped restart pending - waiting for the next morning (working hours)"; exit 0; fi ;;
                      scheduled|postponed) ;;
                      *) echo "usage: excitel-reboot scheduled|required|catchup|postponed"; exit 1 ;;
                    esac
                    if [ "$MODE" != "postponed" ] && [ "$up" -lt $((MIN_UPTIME_HOURS * 3600)) ]; then
                      log "skipped: laptop restarted $((up / 60)) minutes ago"; rm -f "$ST/reboot-pending"; exit 0
                    fi
                    if lid_closed && ! on_ac; then
                      log "skipped: on battery with lid closed (e.g. in a bag) - back to sleep, restart later"
                      touch "$ST/reboot-pending"; systemctl suspend; exit 0
                    fi
                    users=$(/usr/local/sbin/excitel-notify users 2>/dev/null)
                    if [ -n "$users" ]; then
                      if in_work_hours; then secs=$((CATCHUP_WARN_MINUTES * 60)); else secs=$((WARN_MINUTES * 60)); fi
                      mins=$((secs / 60))
                      title="Excitel IT – Scheduled maintenance"
                      if [ "$MODE" = "postponed" ]; then
                        log "postponed restart: warning $users ($mins min)"
                        /usr/local/sbin/excitel-notify info "$title" "Your laptop will restart in $mins minutes (postponed restart). Please save your work now."
                        sleep "$secs"
                      else
                        log "warning $users ($mins min)"
                        /usr/local/sbin/excitel-notify ask "$title" "Your laptop will restart in $mins minutes to finish installing updates.
                    Please save your work now." "$secs"
                        if [ $? -eq 10 ]; then
                          log "postponed ${POSTPONE_MINUTES} min by user"
                          systemd-run --quiet --collect --unit="excitel-reboot-postponed-$(date +%s)" \
                            --on-active="${POSTPONE_MINUTES}m" /usr/local/sbin/excitel-reboot postponed >/dev/null 2>&1
                          exit 0
                        fi
                      fi
                    fi
                    log "restarting now (users: ${users:-none}, uptime $((up / 3600)) h)"
                    rm -f "$ST/reboot-pending"
                    printf '%s\n%s\n' "$(date '+%F %T')" "${users:-none}" > "$ST/scheduled-reboot"
                    sync; systemctl reboot
                - dest: /usr/local/sbin/excitel-after-reboot
                  mode: "0755"
                  content: !unsafe |
                    #!/bin/bash
                    /usr/local/sbin/not-live-session || exit 0
                    ST=/var/lib/custom-iso; NOTE=/var/lib/excitel-notice; mkdir -p "$NOTE" /var/log/excitel
                    LOG="/var/log/excitel/reboot-$(date +%F).log"
                    if [ "${1:-}" = "idle-check" ]; then
                      if ! /usr/local/sbin/excitel-notify users >/dev/null 2>&1; then
                        echo "$(date '+%F %T') [after-reboot] nobody logged in 15 min after maintenance restart - sleep" >> "$LOG"
                        systemctl suspend
                      fi
                      exit 0
                    fi
                    rm -f "$ST/reboot-pending"                     # any fresh boot = restart done
                    [ -f "$ST/scheduled-reboot" ] || exit 0
                    users=$(sed -n 2p "$ST/scheduled-reboot")
                    apps=$(cat "$ST/updates-since-reboot" 2>/dev/null | sort -u | tr '\n' ',' | sed 's/,$//; s/,/, /g')
                    { echo "BOOT=$(cat /proc/sys/kernel/random/boot_id)"
                      echo "TITLE=Excitel IT – Updates completed ✓"
                      if [ -n "$apps" ]; then echo "BODY=Your laptop is up to date. Updated: $apps."
                      else echo "BODY=Your laptop is up to date."; fi
                    } > "$NOTE/login-notice"
                    chmod 644 "$NOTE/login-notice"
                    rm -f "$ST/scheduled-reboot" "$ST/updates-since-reboot"
                    echo "$(date '+%F %T') [after-reboot] maintenance restart finished" >> "$LOG"
                    if [ "$users" = "none" ]; then              # laptop was idle/asleep before: sleep again if unused
                      systemd-run --quiet --collect --unit="excitel-idle-check-$(date +%s)" --on-active=15m \
                        /usr/local/sbin/excitel-after-reboot idle-check >/dev/null 2>&1
                    fi
                    exit 0
                - dest: /usr/local/bin/excitel-login-notice
                  mode: "0755"
                  content: !unsafe |
                    #!/bin/bash
                    N=/var/lib/excitel-notice/login-notice
                    [ -r "$N" ] || exit 0
                    boot=$(grep -oP '^BOOT=\K.*' "$N"); [ "$boot" = "$(cat /proc/sys/kernel/random/boot_id)" ] || exit 0
                    seen="$HOME/.config/custom-iso/login-notice-seen"
                    [ "$(cat "$seen" 2>/dev/null)" = "$boot" ] && exit 0
                    sleep 20
                    notify-send -a "Excitel IT" -i system-software-update "$(grep -oP '^TITLE=\K.*' "$N")" "$(grep -oP '^BODY=\K.*' "$N")" 2>/dev/null
                    mkdir -p "$(dirname "$seen")"; echo "$boot" > "$seen"
                - dest: /etc/xdg/autostart/excitel-login-notice.desktop
                  mode: "0644"
                  content: !unsafe |
                    [Desktop Entry]
                    Type=Application
                    Name=Excitel IT notices
                    Exec=/usr/local/bin/excitel-login-notice
                    NoDisplay=true
                    X-GNOME-Autostart-enabled=true
                - dest: /usr/lib/systemd/system-sleep/excitel-reboot-catchup
                  mode: "0755"
                  content: !unsafe |
                    #!/bin/sh
                    [ "$1" = "post" ] || exit 0
                    [ -f /var/lib/custom-iso/reboot-pending ] || exit 0
                    systemctl start --no-block excitel-reboot-catchup.service
                    exit 0
                - dest: /usr/local/sbin/excitel-maintenance
                  mode: "0755"
                  content: !unsafe |
                    #!/bin/bash
                    # excitel-maintenance status   -> next restarts, last restart log, log folder size
                    # excitel-maintenance apply    -> re-read /etc/default/excitel-maintenance (days/time)
                    . /etc/default/excitel-maintenance
                    case "${1:-status}" in
                      apply)
                        [ "$(id -u)" -eq 0 ] || { echo "Run with sudo."; exit 1; }
                        sed -i "s|^OnCalendar=.*|OnCalendar=$REBOOT_DAYS *-*-* $REBOOT_TIME:00|; s|^Description=Excitel maintenance restart (.*|Description=Excitel maintenance restart ($REBOOT_DAYS $REBOOT_TIME)|" /etc/systemd/system/excitel-reboot.timer
                        sed -i "s|^OnCalendar=.*|OnCalendar=*-*-* $REBOOT_TIME:00|" /etc/systemd/system/excitel-reboot-required.timer
                        systemctl daemon-reload; systemctl restart excitel-reboot.timer excitel-reboot-required.timer
                        echo "Applied: restart $REBOOT_DAYS $REBOOT_TIME, working hours $WORK_START-$WORK_END" ;;
                      status)
                        systemctl list-timers excitel-reboot.timer excitel-reboot-required.timer --no-pager 2>/dev/null | head -4
                        echo; echo "Restart needed for updates: $([ -f /run/reboot-required ] && echo yes || echo no)"
                        echo "Last restart log:"; ls -1t /var/log/excitel/reboot-*.log 2>/dev/null | head -1 | xargs -r tail -n 5
                        echo; echo "Log folder: $(du -sh /var/log/excitel 2>/dev/null | cut -f1) in /var/log/excitel" ;;
                      *) echo "usage: excitel-maintenance status | apply" ;;
                    esac
                - dest: /usr/local/sbin/excitel-update-notify
                  mode: "0755"
                  content: !unsafe |
                    #!/bin/bash
                    # Every 30 min: reads new entries of the apt history and app-updater log, writes
                    # /var/log/excitel/updates-<date>.log and tells logged-in users during working hours.
                    /usr/local/sbin/not-live-session || exit 0
                    . /etc/default/excitel-maintenance 2>/dev/null
                    WORK_START=${WORK_START:-8}; WORK_END=${WORK_END:-22}; REBOOT_TIME=${REBOOT_TIME:-07:00}
                    ST=/var/lib/custom-iso; mkdir -p "$ST" /var/log/excitel
                    LOG="/var/log/excitel/updates-$(date +%F).log"
                    QUEUE="$ST/notify-queue"
                    new_part() {   # $1 file, $2 offset-state -> prints only new text since last run
                      local f="$1" o="$2" size off
                      [ -f "$f" ] || return 0
                      size=$(stat -c %s "$f"); off=$(cat "$o" 2>/dev/null || echo "$size")   # first run: no old news
                      [ "$size" -lt "$off" ] && off=0                                       # log was rotated
                      echo "$size" > "$o"
                      tail -c +$((off + 1)) "$f"
                    }
                    friendly() {
                      case "$1" in
                        google-chrome-stable) echo "Google Chrome" ;; firefox) echo "Firefox" ;; code) echo "VS Code" ;;
                        zoom) echo "Zoom" ;; slack-desktop) echo "Slack" ;; viber) echo "Viber" ;;
                        onlyoffice-desktopeditors) echo "OnlyOffice" ;; rustdesk) echo "RustDesk" ;; localsend) echo "LocalSend" ;;
                        tabby-terminal) echo "Tabby" ;; wasistlos) echo "WhatsApp" ;; omacal) echo "OmaCal" ;; winbox) echo "WinBox" ;;
                        ghostty) echo "Ghostty" ;; libreoffice-core) echo "LibreOffice" ;; wireshark-qt|wireshark) echo "Wireshark" ;;
                        filezilla) echo "FileZilla" ;; vlc) echo "VLC" ;; gimp) echo "GIMP" ;; inkscape) echo "Inkscape" ;;
                        putty) echo "PuTTY" ;; remmina) echo "Remmina" ;;
                      esac
                    }
                    hist=$(new_part /var/log/apt/history.log "$ST/apt-history.offset")
                    appl=$(new_part /var/log/app-auto-update.log "$ST/app-update.offset")
                    pkgs=$(printf '%s\n' "$hist" | grep -E '^(Upgrade|Install):' | sed -E 's/^[A-Za-z]+: //' \
                           | sed -E 's/\), /)\n/g' | sed -E 's/^ *([^: ]+).*/\1/' | sort -u)
                    apps=""
                    for p in $pkgs; do n=$(friendly "$p"); [ -n "$n" ] && apps="$apps$n"$'\n'; done
                    printf '%s\n' "$appl" | grep -q '^Telegram: installed' && apps="${apps}Telegram"$'\n'
                    apps=$(printf '%s' "$apps" | sed '/^$/d' | sort -u)
                    n_pkgs=$(printf '%s\n' "$pkgs" | sed '/^$/d' | wc -l)
                    if [ "$n_pkgs" -gt 0 ] || [ -n "$apps" ]; then
                      { echo "$(date '+%F %T') updated packages: $n_pkgs"
                        [ -n "$apps" ] && echo "  apps: $(printf '%s' "$apps" | tr '\n' ',' | sed 's/,$//; s/,/, /g')"
                        printf '%s\n' "$pkgs" | sed '/^$/d' | sed 's/^/  - /'
                      } >> "$LOG"
                      [ -n "$apps" ] && { printf '%s\n' "$apps" >> "$ST/updates-since-reboot"; printf '%s\n' "$apps" >> "$QUEUE"; }
                    fi
                    # Security update needs a restart: tell users once per boot
                    boot=$(cat /proc/sys/kernel/random/boot_id)
                    if [ -f /run/reboot-required ] && [ "$(cat "$ST/reboot-notice-boot" 2>/dev/null)" != "$boot" ]; then
                      echo "$(date '+%F %T') restart required: $(tr '\n' ' ' < /run/reboot-required.pkgs 2>/dev/null)" >> "$LOG"
                      echo "__REBOOT__" >> "$QUEUE"
                      echo "$boot" > "$ST/reboot-notice-boot"
                    fi
                    # Deliver queued notices only during working hours to someone logged in
                    hour=$(date +%-H)
                    [ -s "$QUEUE" ] || exit 0
                    [ "$hour" -ge "$WORK_START" ] && [ "$hour" -lt "$WORK_END" ] || exit 0
                    /usr/local/sbin/excitel-notify users >/dev/null 2>&1 || exit 0
                    q_apps=$(grep -v '^__REBOOT__$' "$QUEUE" | sort -u | tr '\n' ',' | sed 's/,$//; s/,/, /g')
                    if [ -n "$q_apps" ]; then
                      /usr/local/sbin/excitel-notify info "Excitel IT – App updated" \
                        "Updated: $q_apps. Restart the app to use the new version."
                    fi
                    if grep -qx '__REBOOT__' "$QUEUE" && [ -f /run/reboot-required ]; then
                      /usr/local/sbin/excitel-notify info "Excitel IT – Restart needed" \
                        "Important security updates were installed. Your laptop will restart tomorrow at $REBOOT_TIME, or restart it yourself at a convenient time."
                    fi
                    : > "$QUEUE"
                    exit 0
                - dest: /usr/local/sbin/excitel-logs
                  mode: "0755"
                  content: !unsafe |
                    #!/bin/bash
                    # excitel-logs        (every 15 min) health, Chrome, graphics, hangs; 7-day retention
                    # excitel-logs boot   (once per boot)  boot time, slow and failed services
                    /usr/local/sbin/not-live-session || exit 0
                    D=/var/log/excitel; ST=/var/lib/custom-iso; mkdir -p "$D" "$ST"
                    day=$(date +%F); ts=$(date '+%F %T'); now=$(date +%s)
                    if [ "${1:-}" = "boot" ]; then
                      { echo "===== $ts boot $(cat /proc/sys/kernel/random/boot_id)"
                        systemd-analyze 2>/dev/null | head -2
                        echo "-- slowest services:"; systemd-analyze blame --no-pager 2>/dev/null | head -10
                        echo "-- failed services:"; systemctl --failed --no-legend --no-pager 2>/dev/null || true
                        echo "-- kernel: $(uname -r)   cmdline: $(cat /proc/cmdline)"
                      } >> "$D/boot-$day.log"
                      exit 0
                    fi
                    last=$(cat "$ST/logs.lastrun" 2>/dev/null || echo $((now - 900))); echo "$now" > "$ST/logs.lastrun"
                    since="@$last"
                    # 1) system health (RAM, zram, pressure, load, temperature, CPU speed)
                    read -r ram_used ram_avail < <(free -m | awk '/^Mem:/{print $3, $7}')
                    zr=$(zramctl --noheadings --raw --output DATA,COMPR,DISKSIZE 2>/dev/null | head -n1)
                    pm=$(awk '/^some/{sub("avg10=","",$2); print $2}' /proc/pressure/memory 2>/dev/null)
                    pio=$(awk '/^some/{sub("avg10=","",$2); print $2}' /proc/pressure/io 2>/dev/null)
                    temp=$(for z in /sys/class/thermal/thermal_zone*; do t=$(cat "$z/temp" 2>/dev/null) && echo $((t / 1000)); done | sort -n | tail -1)
                    echo "$ts ram_used=${ram_used}MB ram_avail=${ram_avail}MB zram=[${zr:-none}] mem_pressure=${pm:-?} io_pressure=${pio:-?} load=$(cut -d' ' -f1 /proc/loadavg) temp=${temp:-?}C" >> "$D/system-health-$day.log"
                    # 2) Chrome: processes, memory, acceleration state, crashes
                    cprocs=$(pgrep -c -x chrome 2>/dev/null); cprocs=${cprocs:-0}   # pgrep prints 0 itself when none
                    cmem=$(ps -C chrome -o rss= 2>/dev/null | awk '{s+=$1} END {printf "%d", s/1024}')
                    echo "$ts chrome_processes=$cprocs chrome_mem=${cmem:-0}MB $(/usr/local/sbin/chrome-gpu status 2>/dev/null)" >> "$D/chrome-$day.log"
                    journalctl --since "$since" -q --no-pager 2>/dev/null | grep -iE 'chrome.*(segfault|crash|core dump|gpu process)|coredump.*chrome' >> "$D/chrome-$day.log"
                    # 3) graphics / display / driver (flicker, frozen screen, GPU hangs, PSR)
                    journalctl -k --since "$since" -q --no-pager 2>/dev/null \
                      | grep -iE 'i915|xe |drm|psr|gpu hang|edp|vblank|flip_done|atomic commit|hdmi|displayport' >> "$D/graphics-$day.log"
                    # 4) hangs: memory killer, blocked tasks, lockups, high pressure
                    journalctl --since "$since" -q --no-pager 2>/dev/null \
                      | grep -iE 'earlyoom.*(sending|low memory)|blocked for more than|hung_task|oom-kill|out of memory|soft lockup|watchdog: BUG|ensure-nemo-desktop' >> "$D/hangs-$day.log"
                    awk -v p="${pm:-0}" 'BEGIN{exit !(p > 10)}' && echo "$ts high memory pressure ${pm} (laptop slow)" >> "$D/hangs-$day.log"
                    # 5) keep only 7 days, max 200 MB
                    find "$D" -maxdepth 1 -type f \( -name '*.log' -o -name 'support-*.tar.gz' \) -mtime +6 -delete 2>/dev/null
                    while [ "$(du -sm "$D" | cut -f1)" -gt 200 ]; do
                      oldest=$(ls -1tr "$D"/* 2>/dev/null | head -n1); [ -n "$oldest" ] || break; rm -f "$oldest"
                    done
                    chmod 640 "$D"/*.log 2>/dev/null; chgrp adm "$D"/*.log 2>/dev/null
                    exit 0
                - dest: /usr/local/sbin/laptop-logs
                  mode: "0755"
                  content: !unsafe |
                    #!/bin/bash
                    # laptop-logs collect  -> /var/log/excitel/support-<laptop>-<date>.tar.gz (prints the path)
                    # laptop-logs status   -> what is in the log folder
                    D=/var/log/excitel
                    case "${1:-status}" in
                      collect)
                        [ "$(id -u)" -eq 0 ] || { echo "Run with sudo."; exit 1; }
                        host=$(hostname); out="$D/support-$host-$(date +%F-%H%M).tar.gz"
                        tmp=$(mktemp -d)
                        { echo "laptop: $host   model: $(cat /sys/class/dmi/id/sys_vendor /sys/class/dmi/id/product_name 2>/dev/null | tr '\n' ' ')"
                          echo "date: $(date)   uptime: $(uptime -p)"; . /etc/os-release; echo "os: $PRETTY_NAME   kernel: $(uname -r)"
                          echo "cmdline: $(cat /proc/cmdline)"
                          echo; lspci -k 2>/dev/null | grep -iA3 'vga\|display'
                          echo; free -h; echo; zramctl 2>/dev/null; swapon --show 2>/dev/null
                          echo; lsblk -d -o NAME,ROTA,SIZE,MODEL 2>/dev/null
                          echo; /usr/local/sbin/chrome-gpu status 2>/dev/null
                          echo; systemctl --failed --no-pager 2>/dev/null
                        } > "$tmp/system-info.txt" 2>&1
                        journalctl --since "-7 days" -p warning -q --no-pager 2>/dev/null | tail -c 20000000 > "$tmp/journal-warnings-7days.txt"
                        files=()
                        for f in "$D"/*.log /var/log/browser-health /var/log/app-auto-update.log /var/log/firmware-auto-update.log \
                                 /var/log/firstboot-apps.log /var/log/custom-iso-setup.log; do [ -e "$f" ] && files+=("$f"); done
                        tar -czf "$out" --ignore-failed-read -C "$tmp" system-info.txt journal-warnings-7days.txt "${files[@]}" 2>/dev/null
                        rm -rf "$tmp"
                        ls -1t "$D"/support-*.tar.gz 2>/dev/null | tail -n +4 | xargs -r rm -f       # keep the 3 newest
                        echo "$out" ;;
                      status)
                        echo "Log folder /var/log/excitel ($(du -sh $D 2>/dev/null | cut -f1)), kept 7 days:"
                        ls -1 "$D" 2>/dev/null | sed 's/-20[0-9-]*\.log$//' | sort | uniq -c | sed 's/^/  /' ;;
                      *) echo "usage: sudo laptop-logs collect | status" ;;
                    esac
              loop_control:
                label: "{{ item.dest }}"

            - name: Maintenance services
              ansible.builtin.copy:
                dest: "/etc/systemd/system/{{ item.name }}"
                mode: "0644"
                content: "{{ item.content }}"
              loop:
                - name: excitel-reboot.service
                  content: !unsafe |
                    [Unit]
                    Description=Excitel scheduled maintenance restart

                    [Service]
                    Type=oneshot
                    ExecCondition=/usr/local/sbin/not-live-session
                    ExecStart=/usr/local/sbin/excitel-reboot scheduled
                - name: excitel-reboot-required.service
                  content: !unsafe |
                    [Unit]
                    Description=Excitel restart for security updates (next morning)

                    [Service]
                    Type=oneshot
                    ExecCondition=/usr/local/sbin/not-live-session
                    ExecStart=/usr/local/sbin/excitel-reboot required
                - name: excitel-reboot-catchup.service
                  content: !unsafe |
                    [Unit]
                    Description=Excitel maintenance restart skipped earlier (catch-up after resume)

                    [Service]
                    Type=oneshot
                    ExecCondition=/usr/local/sbin/not-live-session
                    ExecStartPre=/bin/sleep 60
                    ExecStart=/usr/local/sbin/excitel-reboot catchup
                - name: excitel-after-reboot.service
                  content: !unsafe |
                    [Unit]
                    Description=Excitel after-restart notice
                    After=local-fs.target

                    [Service]
                    Type=oneshot
                    ExecCondition=/usr/local/sbin/not-live-session
                    ExecStart=/usr/local/sbin/excitel-after-reboot
                    RemainAfterExit=yes

                    [Install]
                    WantedBy=multi-user.target
                - name: excitel-update-notify.service
                  content: !unsafe |
                    [Unit]
                    Description=Excitel update notices and updates log

                    [Service]
                    Type=oneshot
                    ExecCondition=/usr/local/sbin/not-live-session
                    ExecStart=/usr/local/sbin/excitel-update-notify
                    Nice=19
                    IOSchedulingClass=idle
                - name: excitel-update-notify.timer
                  content: !unsafe |
                    [Unit]
                    Description=Excitel update notices (every 30 min)

                    [Timer]
                    OnBootSec=10min
                    OnUnitActiveSec=30min

                    [Install]
                    WantedBy=timers.target
                - name: excitel-logs.service
                  content: !unsafe |
                    [Unit]
                    Description=Excitel troubleshooting logs (7 days)

                    [Service]
                    Type=oneshot
                    ExecCondition=/usr/local/sbin/not-live-session
                    ExecStart=/usr/local/sbin/excitel-logs
                    Nice=19
                    IOSchedulingClass=idle
                - name: excitel-logs.timer
                  content: !unsafe |
                    [Unit]
                    Description=Excitel troubleshooting logs (every 15 min)

                    [Timer]
                    OnBootSec=5min
                    OnUnitActiveSec=15min

                    [Install]
                    WantedBy=timers.target
                - name: excitel-logs-boot.service
                  content: !unsafe |
                    [Unit]
                    Description=Excitel boot log

                    [Service]
                    Type=oneshot
                    ExecCondition=/usr/local/sbin/not-live-session
                    ExecStart=/usr/local/sbin/excitel-logs boot
                    Nice=19
                    IOSchedulingClass=idle
                - name: excitel-logs-boot.timer
                  content: !unsafe |
                    [Unit]
                    Description=Excitel boot log (3 min after boot)

                    [Timer]
                    OnBootSec=3min

                    [Install]
                    WantedBy=timers.target
              loop_control:
                label: "{{ item.name }}"

            - name: Restart timers (Sun + Thu 07:00, daily 07:00 if needed; existing days/time kept)
              ansible.builtin.copy:
                dest: "/etc/systemd/system/{{ item.name }}"
                mode: "0644"
                force: false
                content: "{{ item.content }}"
              loop:
                - name: excitel-reboot.timer
                  content: !unsafe |
                    [Unit]
                    Description=Excitel maintenance restart (Sun,Thu 07:00)

                    [Timer]
                    OnCalendar=Sun,Thu *-*-* 07:00:00
                    WakeSystem=true
                    AccuracySec=1min

                    [Install]
                    WantedBy=timers.target
                - name: excitel-reboot-required.timer
                  content: !unsafe |
                    [Unit]
                    Description=Excitel restart for security updates (daily 07:00, only if needed)

                    [Timer]
                    OnCalendar=*-*-* 07:00:00
                    AccuracySec=1min

                    [Install]
                    WantedBy=timers.target
              loop_control:
                label: "{{ item.name }}"

            - name: Old boot entry for logs off (as in custom-iso-setup.sh)
              ansible.builtin.command: systemctl disable excitel-logs-boot.service
              changed_when: false
              failed_when: false

            - name: Maintenance timers on
              ansible.builtin.systemd:
                name: "{{ item }}"
                enabled: true
                state: started
                daemon_reload: true
              loop: [excitel-reboot.timer, excitel-reboot-required.timer, excitel-update-notify.timer,
                     excitel-logs.timer, excitel-logs-boot.timer]

            - name: After-boot notice enabled (runs at the next boot, not now)
              ansible.builtin.systemd:
                name: excitel-after-reboot.service
                enabled: true


            # ---------------- 10. does a change need a reboot? ----------------
            - name: Is zram active now?
              ansible.builtin.shell: swapon --noheadings --show=NAME | grep -q '^/dev/zram' && echo yes || echo no
              register: r_zram_active
              changed_when: false
              check_mode: false

            - name: Collect reboot reasons
              ansible.builtin.set_fact:
                reboot_reasons: >-
                  {{ (['zram size/settings changed'] if r_zram_cfg.changed else [])
                   + (['zram not active yet'] if r_zram_active.stdout == 'no' else [])
                   + (['zram-only swap newly set up'] if (r_speedtune.changed or r_zramonly_script.changed or r_zramonly_unit.changed) else [])
                   + (['desktop animations changed (need a new login)'] if (r_effects.changed | default(false) or r_schema.changed | default(false)) else [])
                   + (['Netflix/DRM fix for noexec /home (needs a new login)'] if (r_widevine_units.changed and r_noexec.stdout == 'yes') else [])
                   + (['new group membership netdev/dialout/wireshark (needs a new login)'] if r_groups.changed | default(false) else []) }}

        - name: Undo the fixes (mode=revert)
          when: mode == 'revert'
          block:
            - name: Is there a backup on this laptop?
              ansible.builtin.stat:
                path: /var/lib/browser-slowness-playbook/backup.done
              register: r_has_backup

            - name: Nothing to undo (already reverted, or never applied)
              when: not r_has_backup.stat.exists
              block:
                - name: Note it in the laptop log
                  ansible.builtin.shell: cat >> {{ laptop_log }}
                  changed_when: false
                  args:
                    stdin: "===== {{ now(fmt='%Y-%m-%d %H:%M:%S') }} REVERT: nothing to undo on {{ ansible_hostname }} (no backup) =====\n"
                  check_mode: false

                - name: End here for this laptop
                  ansible.builtin.meta: end_host

            - name: Is the animations tool there?
              ansible.builtin.stat:
                path: /usr/local/sbin/cinnamon-effects-off
              register: r_effects_tool

            - name: Animations back to each user's own values
              ansible.builtin.command: /usr/local/sbin/cinnamon-effects-off --restore
              register: r_effects_restore
              changed_when: "'RESTORED' in r_effects_restore.stdout"
              when: r_effects_tool.stat.exists

            - name: Files and services back to the original
              ansible.builtin.command: /usr/local/sbin/browser-slowness-backup restore
              register: r_restore
              changed_when: true

            - name: Remove the backup tool
              ansible.builtin.file:
                path: /usr/local/sbin/browser-slowness-backup
                state: absent

            - name: Revert log text and restart
              ansible.builtin.set_fact:
                reboot_reasons: ['revert: zram, swap and memory settings return to the original at the restart']
                run_log: |
                  ===== {{ now(fmt='%Y-%m-%d %H:%M:%S') }} browser-slowness playbook (v5) REVERT on {{ ansible_hostname }} =====
                  Run by: {{ lookup('env', 'USER') or lookup('env', 'LOGNAME') or '?' }}{{ '   (DRY RUN - nothing changed)' if ansible_check_mode else '' }}
                  Animations: {{ (r_effects_restore.stdout_lines | default([]) | join(', ')) or 'nothing to restore' }}
                  Restore:
                  {{ r_restore.stdout | default('n/a') | indent(2, true) }}

      rescue:
        - name: Write the failure to the logs
          ansible.builtin.set_fact:
            fail_text: "FAILED at task '{{ ansible_failed_task.name | default('?') }}': {{ ansible_failed_result.msg | default(ansible_failed_result.stderr | default('unknown error')) }}"

        - name: Failure in the laptop log
          ansible.builtin.shell: cat >> {{ laptop_log }}
          changed_when: false
          args:
            stdin: "===== {{ now(fmt='%Y-%m-%d %H:%M:%S') }} browser-slowness playbook ===== \n{{ fail_text }}\n"
          check_mode: false

        - name: Failure in the Ansible machine log
          ansible.builtin.shell: cat >> "{{ controller_log_dir }}/{{ ansible_hostname }}.log"
          changed_when: false
          args:
            stdin: "===== {{ now(fmt='%Y-%m-%d %H:%M:%S') }} {{ ansible_hostname }} ===== \n{{ fail_text }}\n"
          delegate_to: localhost
          become: false
          check_mode: false

        - name: Stop this laptop
          ansible.builtin.fail:
            msg: "{{ fail_text }}"

    # ---------------- 9. log of this run ----------------
    - name: When did this playbook last restart the laptop?
      ansible.builtin.stat:
        path: /var/lib/browser-slowness-reboot.stamp
      register: r_stamp

    - name: Decide about the restart
      ansible.builtin.set_fact:
        reboot_action: >-
          {{ 'none' if not reboot_reasons
             else 'disabled' if not (allow_reboot | bool)
             else 'dryrun' if ansible_check_mode
             else 'skipped' if (r_stamp.stat.exists and (ansible_date_time.epoch | int - r_stamp.stat.mtime | int) < 86400)
             else 'scheduled' }}

    - name: Restart line for the log
      ansible.builtin.set_fact:
        reboot_line: >-
          {{ 'not needed' if reboot_action == 'none'
             else ('NEEDED - ' ~ (reboot_reasons | join('; ')) ~ ' - ' ~
                   {'disabled': 'allow_reboot=false: please restart later',
                    'dryrun': 'dry run: no restart',
                    'skipped': 'SKIPPED: this playbook already restarted the laptop in the last 24 hours - please check zram',
                    'scheduled': 'restart scheduled in ' ~ reboot_warning_minutes ~ ' minutes (warning shown; cancel: sudo shutdown -c)'}[reboot_action]) }}

    - name: Build the run log
      when: mode == 'apply'
      ansible.builtin.set_fact:
        run_log: |
          ===== {{ now(fmt='%Y-%m-%d %H:%M:%S') }} browser-slowness playbook (v5) on {{ ansible_hostname }} =====
          Run by: {{ lookup('env', 'USER') | default('?') }} from {{ lookup('pipe', 'hostname') }}{{ '   (DRY RUN - nothing changed)' if ansible_check_mode else '' }}
          Before:
          {{ before.stdout | default('n/a') | indent(2, true) }}
          Changes (CHANGED = was different and has been set, OK = already correct):
            earlyoom settings ............ {{ 'CHANGED' if r_earlyoom_cfg.changed else 'OK' }}
            zram swap ({{ zram_percent }}% of RAM) ...... {{ 'CHANGED' if r_zram_cfg.changed else 'OK' }}
            packages ..................... {{ 'INSTALLED' if r_packages.changed else 'OK' }}
            memory settings (sysctl) ..... {{ 'CHANGED' if r_sysctl.changed else 'OK' }}
            zram-only swap ............... {{ 'CHANGED' if (r_speedtune.changed or r_zramonly_script.changed or r_zramonly_unit.changed) else 'OK' }}
            Chrome speed policies ........ {{ 'CHANGED' if r_policy.changed else 'OK' }}
            Cinnamon animations off ...... {{ ('CHANGED ' ~ (r_effects.stdout_lines | default([]) | join(', '))) if r_effects.changed | default(false) else ('OK' if r_cinnamon.stat.exists else 'SKIPPED (no Cinnamon)') }}
            Netflix/DRM noexec fix ....... {{ ('active (/home is noexec)' if r_noexec.stdout == 'yes' else 'installed, not needed (/home not noexec)') }}{{ ' - hint removed' if r_widevine_now.changed else '' }}
            Browser monitor + report ..... {{ 'CHANGED' if (r_collect.changed or r_monitor_units.changed) else 'OK' }}
            VPN plugins .................. {{ 'INSTALLED' if r_vpn_pkgs.changed | default(false) else 'OK' }}
            VPN/Wi-Fi/RustDesk rights .... {{ 'CHANGED' if r_polkit.changed | default(false) else 'OK' }}
            Wi-Fi power saving off ....... {{ 'CHANGED' if (r_wifi_ps.changed | default(false) or r_wifi_now.changed | default(false)) else 'OK' }}
            Wireshark without sudo ....... {{ r_wireshark.stdout | default('n/a') | replace('CHANGED', 'turned on') }}
            Groups (netdev/dialout/ws) ... {{ ('CHANGED: ' ~ (r_groups.stdout_lines | default([]) | join(', '))) if r_groups.changed | default(false) else 'OK' }}
            Update pop-ups hidden ........ {{ 'CHANGED' if r_popups.changed | default(false) else 'OK' }}
            Automatic updates ............ {{ 'CHANGED' if (r_aptcfg.changed | default(false) or r_apt_timers.changed | default(false)) else 'OK' }}
            Restarts Sun+Thu 07:00 ....... on (check: excitel-maintenance status)

    - name: Run log on the laptop
      ansible.builtin.shell: cat >> {{ laptop_log }} && chmod 644 {{ laptop_log }}
      changed_when: false
      args:
        stdin: "{{ run_log }}Reboot: {{ reboot_line }}\n"
      check_mode: false

    - name: Run log on the Ansible machine
      ansible.builtin.shell: cat >> "{{ controller_log_dir }}/{{ ansible_hostname }}.log"
      changed_when: false
      args:
        stdin: "{{ run_log }}Reboot: {{ reboot_line }}\n"
      delegate_to: localhost
      become: false
      check_mode: false

    - name: Show the result
      ansible.builtin.debug:
        msg: "{{ run_log.splitlines() + ['Reboot: ' ~ reboot_line] }}"

    # ---------------- 10. restart only when needed ----------------
    - name: Restart in {{ reboot_warning_minutes }} minutes (only when a change needs it)
      when: reboot_action == 'scheduled'
      block:
        - name: Restart-warning tool
          ansible.builtin.copy:
            dest: /usr/local/sbin/restart-warning
            mode: "0755"
            content: !unsafe |
              #!/bin/bash
              # restart-warning MINUTES : desktop notice + terminal message to everyone logged in
              M="${1:-5}"
              MSG="IT maintenance: this laptop will restart in $M minutes to finish a speed fix. Please save your work."
              cd /
              for s in $(loginctl list-sessions --no-legend 2>/dev/null | awk '{print $1}'); do
                t=$(loginctl show-session "$s" -p Type --value 2>/dev/null)
                [[ $t == x11 || $t == wayland ]] || continue
                u=$(loginctl show-session "$s" -p Name --value); uid=$(id -u "$u" 2>/dev/null) || continue
                runuser -u "$u" -- env DBUS_SESSION_BUS_ADDRESS="unix:path=/run/user/$uid/bus" \
                  notify-send -u critical -i system-reboot "Restart in $M minutes" "$MSG" 2>/dev/null || true
              done
              wall "$MSG" 2>/dev/null || true
              exit 0

        - name: Warn the logged-in user
          ansible.builtin.command: /usr/local/sbin/restart-warning {{ reboot_warning_minutes }}
          changed_when: false

        - name: Remember this restart (max one per 24 hours)
          ansible.builtin.copy:
            dest: /var/lib/browser-slowness-reboot.stamp
            mode: "0644"
            content: "{{ now(fmt='%Y-%m-%d %H:%M:%S') }} {{ reboot_reasons | join('; ') }}\n"

        - name: Schedule the restart (the playbook finishes now; cancel with 'sudo shutdown -c')
          ansible.builtin.command:
            argv:
              - shutdown
              - -r
              - "+{{ reboot_warning_minutes }}"
              - "IT maintenance - restarting to finish a speed fix. Please save your work."
          changed_when: true
