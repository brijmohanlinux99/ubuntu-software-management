            - name: New users created with adduser also get netdev
              ansible.builtin.shell: |
                [ -f /etc/adduser.conf ] || exit 0
                before=$(md5sum /etc/adduser.conf)
                sed -i 's/^#\?ADD_EXTRA_GROUPS=.*/ADD_EXTRA_GROUPS=1/' /etc/adduser.conf
                grep -q '^ADD_EXTRA_GROUPS=' /etc/adduser.conf || echo 'ADD_EXTRA_GROUPS=1' >> /etc/adduser.conf
                if grep -q '^EXTRA_GROUPS=' /etc/adduser.conf; then
                  grep -q '^EXTRA_GROUPS=.*netdev' /etc/adduser.conf || \
                    sed -i 's/^EXTRA_GROUPS="\(.*\)"/EXTRA_GROUPS="\1 netdev"/' /etc/adduser.conf
                else
