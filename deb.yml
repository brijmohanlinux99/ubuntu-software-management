            # ================ 11-13. VPN, Wi-Fi, RustDesk, groups (from custom-iso-setup.sh, no lockdown) ================
            - name: Live-session check tool (used by the restart and update tools)
              ansible.builtin.copy:
                dest: /usr/local/sbin/not-live-session
                mode: "0755"
                content: !unsafe |
                  #!/bin/sh
                  # exit 0 = installed system, exit 1 = live USB session (installer)
                  grep -qwE 'boot=casper|layerfs-path=[^ ]*' /proc/cmdline 2>/dev/null && exit 1
                  [ -d /cdrom/casper ] && exit 1
                  [ "$(findmnt -n -o FSTYPE / 2>/dev/null)" = "overlay" ] && exit 1
                  exit 0
                  NOTLIVE_EOF

            - name: VPN plugins and tools (only missing ones are installed)
              ansible.builtin.apt:
                name: [network-manager-openvpn-gnome, network-manager-l2tp-gnome, network-manager-sstp-gnome,
                       network-manager-openconnect-gnome, network-manager-vpnc-gnome, network-manager-pptp-gnome,
                       network-manager-fortisslvpn-gnome, wireguard-tools, openvpn, openconnect, strongswan,
                       xl2tpd, sstp-client, openfortivpn, vpnc, iw]
                state: present
                lock_timeout: 600
              register: r_vpn_pkgs

            - name: Users may manage VPN, Wi-Fi and RustDesk without sudo (allow rules only, nothing blocked)
              ansible.builtin.copy:
                dest: /etc/polkit-1/rules.d/20-user-access.rules
                mode: "0644"
                content: !unsafe |
                  // Installed by browser-slowness.yml: the "allow" rules of custom-iso-setup.sh, without install blocking
                  polkit.addRule(function(action, subject) {
                      // RustDesk "Unlock settings" (older versions use pkexec for a harmless check)
                      if (action.id == "org.freedesktop.policykit.exec" && subject.local && subject.active) {
                          var prog = action.lookup("program") || "";
                          if (prog == "/usr/share/rustdesk/files/polkit" || prog == "/usr/bin/echo" || prog == "/bin/echo") {
                              return polkit.Result.AUTH_SELF;
                          }
                      }
                      if (action.id.indexOf("com.rustdesk.") == 0 && subject.local && subject.active) {
                          return polkit.Result.AUTH_SELF;
                      }
                      // Everyone at the computer, and netdev members from any session: network, Wi-Fi and VPN profiles
                      if (action.id.indexOf("org.freedesktop.NetworkManager.") == 0 &&
                          ((subject.local && subject.active) || subject.isInGroup("netdev"))) {
                          return polkit.Result.YES;
                      }
                      // Everyone at the computer: start/stop/restart RustDesk and VPN services
                      if (action.id == "org.freedesktop.systemd1.manage-units" && subject.local && subject.active) {
                          var unit = action.lookup("unit") || "";
                          var allowed = /^(rustdesk|openvpn.*|wg-quick@.*|strongswan.*|ipsec|xl2tpd|openfortivpn.*|forticlient.*|vpnagentd|NetworkManager)\.service$/;
                          if (allowed.test(unit)) {
                              return polkit.Result.YES;
                          }
                      }
                  });
              register: r_polkit

            - name: RustDesk "Unlock settings" with the user's own password (runs only "echo" as root)
              ansible.builtin.copy:
                dest: /etc/sudoers.d/zz-rustdesk-unlock
                mode: "0440"
                validate: visudo -cf %s
                content: |
                  # RustDesk unlock check: runs only "echo" as root
                  ALL ALL=(root) /usr/bin/sh -c echo, /bin/sh -c echo

            - name: Is RustDesk installed?
              ansible.builtin.stat:
                path: /lib/systemd/system/rustdesk.service
              register: r_rustdesk

            - name: RustDesk service at every boot (users can use and configure it)
              ansible.builtin.systemd:
                name: rustdesk
                enabled: true
                state: started
              when: r_rustdesk.stat.exists

            - name: VPN diagnostic tool (sudo vpn-check)
              ansible.builtin.copy:
                dest: /usr/local/bin/vpn-check
                mode: "0755"
                content: !unsafe |
                  #!/bin/bash
                  # Shows why a VPN does not start. Run as admin: sudo vpn-check
                  echo "== VPN plugins installed =="
                  ls /usr/lib/NetworkManager/VPN/*.name 2>/dev/null | xargs -r -n1 basename
                  echo; echo "== NetworkManager =="; systemctl is-active NetworkManager
                  echo; echo "== Lockdown polkit rule =="
                  [ -f /etc/polkit-1/rules.d/10-lockdown.rules ] && echo "installed" || echo "MISSING (reboot needed)"
                  grep -qs "NetworkManager" /etc/polkit-1/rules.d/10-lockdown.rules /etc/polkit-1/rules.d/20-user-access.rules && echo "VPN permission for users: yes"
                  echo; echo "== VPN connections =="; nmcli -f NAME,TYPE,ACTIVE connection show | grep -Ei 'vpn|wireguard|NAME'
                  echo; echo "== Last VPN errors (NetworkManager log, last 2 hours) =="
                  journalctl -u NetworkManager --since "-2h" --no-pager -q 2>/dev/null \
                    | grep -Ei 'vpn|openvpn|l2tp|ipsec|strongswan|sstp|forti|openconnect|wireguard|pptp|vpnc|polkit|not authorized' | tail -n 40
                  echo; echo "== Polkit messages =="
                  journalctl -u polkit --since "-2h" --no-pager -q 2>/dev/null | tail -n 15

            - name: VPN drops - Wi-Fi power saving off (NetworkManager setting)
              ansible.builtin.copy:
                dest: /etc/NetworkManager/conf.d/zz-wifi-powersave-off.conf
                mode: "0644"
                content: |
                  # Wi-Fi power saving makes the card sleep briefly; a VPN tunnel can time out and drop.
                  # 2 = off. Installed by browser-slowness.yml (overrides default-wifi-powersave-on.conf)
                  [connection]
                  wifi.powersave = 2
              register: r_wifi_ps

            - name: VPN drops - Wi-Fi power saving off now (no disconnect)
              ansible.builtin.shell: |
                nmcli general reload conf 2>/dev/null || true
                for d in $(iw dev 2>/dev/null | awk '/Interface/{print $2}'); do
                  if iw dev "$d" get power_save 2>/dev/null | grep -q ': on'; then
                    iw dev "$d" set power_save off && echo "OFF $d"
                  fi
                done; exit 0
              register: r_wifi_now
              changed_when: "'OFF' in r_wifi_now.stdout"

            - name: Wireshark capture without sudo (only if Wireshark is installed)
              ansible.builtin.shell: |
                dpkg-query -W -f='${Status}' wireshark-common 2>/dev/null | grep -q 'install ok installed' || { echo "not installed"; exit 0; }
                cur=$(debconf-show wireshark-common 2>/dev/null | awk -F': ' '/install-setuid/{print $2}')
                [ "$cur" = "true" ] && getent group wireshark >/dev/null && { echo "already on"; exit 0; }
                echo "wireshark-common wireshark-common/install-setuid boolean true" | debconf-set-selections
                DEBIAN_FRONTEND=noninteractive dpkg-reconfigure -f noninteractive wireshark-common && echo "CHANGED"
              register: r_wireshark
              changed_when: "'CHANGED' in r_wireshark.stdout"

            - name: Group sync tool (netdev, dialout, wireshark for every user)
              ansible.builtin.copy:
                dest: /usr/local/sbin/netdev-sync
                mode: "0755"
                content: !unsafe |
                  #!/bin/bash
                  # Group membership for every normal user account (existing and new):
                  #   netdev    - manage network and VPN
                  #   dialout   - console cables / serial devices (switches, routers, scanners)
                  #   wireshark - packet capture; who gets it is set by WIRESHARK_USERS in
                  #               /etc/default/lockdown: "all" | "none" | "user1 user2"
                  WIRESHARK_USERS="all"; ALLOWED_ADMINS=""
                  [ -f /etc/default/lockdown ] && . /etc/default/lockdown
                  for g in netdev dialout; do getent group "$g" >/dev/null || groupadd -r "$g"; done
                  min=$(awk '/^UID_MIN/{print $2}' /etc/login.defs); min=${min:-1000}
                  max=$(awk '/^UID_MAX/{print $2}' /etc/login.defs); max=${max:-60000}
                  in_group() { id -nG "$1" 2>/dev/null | tr ' ' '\n' | grep -qx "$2"; }
                  getent passwd | while IFS=: read -r user _ uid _ _ _ shell; do
                    [[ "$uid" =~ ^[0-9]+$ ]] || continue
                    [ "$uid" -ge "$min" ] && [ "$uid" -le "$max" ] || continue
                    case "$shell" in */nologin|*/false) continue ;; esac
                    for g in netdev dialout; do
                      in_group "$user" "$g" || { usermod -aG "$g" "$user" && echo "added $user to $g"; }
                    done
                    if getent group wireshark >/dev/null; then
                      if [[ " $ALLOWED_ADMINS " == *" $user "* ]]; then want=yes
                      else
                        case "$WIRESHARK_USERS" in
                          all) want=yes ;; none|"") want=no ;;
                          *) [[ " $WIRESHARK_USERS " == *" $user "* ]] && want=yes || want=no ;;
                        esac
                      fi
                      if [ "$want" = "yes" ]; then
                        in_group "$user" wireshark || { usermod -aG wireshark "$user" && echo "added $user to wireshark"; }
                      else
                        in_group "$user" wireshark && gpasswd -d "$user" wireshark >/dev/null && echo "removed $user from wireshark"
                      fi
                    fi
                  done
                  exit 0

            - name: Group sync at every boot and whenever a user is added
              ansible.builtin.copy:
                dest: "/etc/systemd/system/{{ item.name }}"
                mode: "0644"
                content: "{{ item.content }}"
              loop:
                - name: netdev-sync.service
                  content: !unsafe |
                    [Unit]
                    Description=Add all users to the netdev group

                    [Service]
                    Type=oneshot
                    ExecStart=/usr/local/sbin/netdev-sync

                    [Install]
                    WantedBy=multi-user.target
                - name: netdev-sync.path
                  content: !unsafe |
                    [Unit]
                    Description=Watch for new users (add them to netdev)

                    [Path]
                    PathChanged=/etc/passwd

                    [Install]
                    WantedBy=multi-user.target
              loop_control:
                label: "{{ item.name }}"

            - name: Group sync enabled
              ansible.builtin.systemd:
                name: "{{ item }}"
                enabled: true
                daemon_reload: true
              loop: [netdev-sync.service, netdev-sync.path]

            - name: Watch for new users now
