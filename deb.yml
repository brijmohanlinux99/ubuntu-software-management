---
# =============================================================================
# browser-slowness.yml  (v5, 2026-11-22)
# v2: Zoom is never closed by earlyoom; original settings saved before the first change;
#     -e mode=revert undoes everything.
# v3: runs on the laptop itself (hosts: localhost, connection: local) - no inventory and no
#     extra options needed.
# v4: when a change needs it, the laptop restarts 5 minutes after the run (warning on screen);
#     at most one such restart per 24 hours (no restart loop). mode=revert with nothing to undo
#     just logs it and ends without an error.
# v5: adds from custom-iso-setup.sh (without lockdown, passwords or apps): VPN/Wi-Fi/RustDesk
#     rights for normal users, netdev/dialout/wireshark groups, Wi-Fi power saving off (VPN drops),
#     automatic system/app/firmware updates, no update pop-ups, restarts Sun+Thu 07:00.
#     Fixed vs the script: updates only from known repos (no origin=*), skipped restarts never run
#     during working hours, apps are never updated while open (daily retry).
# Ansible playbook: fixes Chrome slowness / laptop freezes on Ubuntu Cinnamon 24.04
# laptops. Runs on the laptop itself. Same speed settings as STEP 11 + 12 of custom-iso-setup.sh.
#
# WHAT IT DOES
#   1. zram compressed swap (zstd, 60% of RAM) + memory settings
#   2. earlyoom: closes a heavy app early instead of the laptop freezing
#   3. zram-only swap: slow disk swap turned off at boot (when zram is active)
#   4. Chrome speed policies (Memory Saver, no background mode) - NO extension is installed
#   5. chrome-gpu: Chrome graphics acceleration switched off automatically after an Intel GPU hang
#   6. Cinnamon animations off for all users (theme, icons, FONTS, wallpaper, clock unchanged)
#   7. Netflix/DRM fix (error M7702-1003) when /home is mounted noexec: Chrome uses its built-in
#      Widevine from /opt. Does nothing on laptops without noexec. Lockdown stays on.
#   8. Browser monitor (every 30 s, 7 days) + `browser-report` command + daily report 23:55
#   9. Log of every run: /var/log/browser-slowness-playbook.log
#                        and /var/log/browser-slowness-runs/<laptop>.log
#  10. Restart ONLY when a change needs it: scheduled 5 minutes after the run, with a warning on
#      screen. Never more than once per 24 hours. If nothing changed, no restart.
#  11. UNDO: -e mode=revert puts back the laptop's ORIGINAL files, services and animation settings
#      (saved before the first change; a laptop set up with custom-iso-setup.sh gets its own
#      settings back). Packages it installed stay installed but switched off; group memberships
#      stay. Then a restart.
#  12. VPN, Wi-Fi and RustDesk settings for normal users without sudo (allow rules only); VPN plugins;
#      `sudo vpn-check`; Wi-Fi power saving off (most common cause of VPN drops)
#  13. Every user (and new users) in netdev, dialout, wireshark; Wireshark capture without sudo
#  14. Automatic updates: system every 6 h (Ubuntu, Chrome, VS Code, Firefox, OnlyOffice repos only),
#      apps daily when closed (Zoom, Slack, RustDesk ...), firmware weekly on charger; no pop-ups;
#      `update-status`
#  15. Restarts Sun + Thu 07:00 and daily 07:00 when an update needs it (outside working hours),
#      notices, 7-day logs in /var/log/excitel (`excitel-maintenance status`, `sudo laptop-logs`)
#
# WHAT IT NEVER TOUCHES
#   admin/root passwords, user accounts, sudo group, Win11 theme/icons/fonts/wallpaper/lock screen,
#   apps (only adds zram-tools, earlyoom, VPN plugins, update tools), lockdown/noexec/install
#   blocking, SSH, GRUB.
#
# REQUIREMENTS
#   Laptop: Ubuntu 24.04, ansible-core 2.14 or newer, run as root (or with sudo), internet (apt).
#
# RUN (on the laptop, as root - e.g. from software-update.sh; no inventory file needed)
#   ansible-playbook /root/ansible/browser-slowness.yml                      # apply
#   ansible-playbook /root/ansible/browser-slowness.yml --check --diff       # dry run, changes nothing
#   ansible-playbook /root/ansible/browser-slowness.yml -e mode=revert       # undo everything
#   ansible-playbook /root/ansible/browser-slowness.yml -e allow_reboot=false # never restart
#   Undo from GitHub only (no command change): set "mode: revert" in vars below and upload.
#   Cancel a scheduled restart on a laptop: sudo shutdown -c
#
# NOTE: do not also run fix-browser-slowness.sh on the same laptop (both manage the same files).
# =============================================================================

- name: Browser slowness fix
  hosts: localhost
  connection: local
  become: true
  gather_facts: true

  vars:
    zram_percent: 60
    mode: apply            # apply | revert
    allow_reboot: true     # false = never restart (changes apply at the next normal restart)
    reboot_warning_minutes: 5
    laptop_log: /var/log/browser-slowness-playbook.log
    controller_log_dir: /var/log/browser-slowness-runs   # not next to the playbook: git clean would delete it
    reboot_reasons: []

  tasks:
    - name: Only Ubuntu laptops, mode apply or revert
      ansible.builtin.assert:
        that:
          - ansible_distribution == 'Ubuntu'
          - mode in ['apply', 'revert']
        fail_msg: "{{ ansible_hostname }}: needs Ubuntu and mode=apply or mode=revert"

    - name: Skip a live USB session
      ansible.builtin.meta: end_host
      when: "'boot=casper' in (ansible_cmdline | default({}))"

    - name: Folder for logs on the Ansible machine
      ansible.builtin.file:
        path: "{{ controller_log_dir }}"
        state: directory
        mode: "0755"
      delegate_to: localhost
      become: false
      run_once: true
      check_mode: false

    - name: Memory before the fix
      ansible.builtin.shell: |
        free -m | sed -n '1,3p'
        echo "Swap:"; swapon --show 2>/dev/null || echo "  none"
        echo "Kernel OOM kills this boot: $(journalctl -k -b --no-pager -q 2>/dev/null | grep -c 'Out of memory: Killed')"
      register: before
      changed_when: false
      check_mode: false

    - name: Run
      block:
        - name: Apply the fixes
          when: mode == 'apply'
          block:
            # ---------------- 0. backup of the original settings (first run only) ----------------
            - name: Backup tool
              ansible.builtin.copy:
                dest: /usr/local/sbin/browser-slowness-backup
                mode: "0755"
                content: !unsafe |
                  #!/bin/bash
                  # browser-slowness-backup save|restore
                  #   save    : before the playbook's FIRST change, keeps a copy of every file it manages (or notes
                  #             that the file did not exist) and the on/off state of each service. Later runs keep
                  #             this first copy, so a revert always returns to the laptop's original state.
                  #   restore : puts every file and service state back, deletes files the playbook added.
                  #             Never stops zram live (a full zram could freeze the laptop): it changes at the reboot.
                  #             Packages installed by the playbook stay installed but switched off.
                  #             Group memberships (netdev, dialout, wireshark) are kept.
                  B=/var/lib/browser-slowness-playbook
                  PATHS=(
                    /etc/default/earlyoom /etc/default/zramswap /etc/sysctl.d/99-lowram.conf
                    /etc/default/speedtune /usr/local/sbin/zram-only-swap /etc/systemd/system/zram-only-swap.service
                    /usr/local/sbin/chrome-speed-policy /etc/opt/chrome/policies/managed/performance.json
                    /etc/default/chrome-gpu /usr/local/sbin/chrome-gpu
                    /etc/systemd/system/chrome-gpu.service /etc/systemd/system/chrome-gpu.timer
                    /usr/share/glib-2.0/schemas/91-browser-slowness-effects.gschema.override /usr/local/sbin/cinnamon-effects-off
                    /usr/local/bin/widevine-noexec-fix
                    /etc/systemd/user/widevine-noexec-fix.service /etc/systemd/user/widevine-noexec-fix.path
                    /usr/local/sbin/browser-health-collect /usr/local/bin/browser-report
                    /etc/systemd/system/browser-health.service /etc/systemd/system/browser-report-daily.service
                    /etc/systemd/system/browser-report-daily.timer /usr/share/applications/browser-report.desktop
                    /usr/local/sbin/restart-warning
                    /usr/local/sbin/not-live-session
                    /etc/polkit-1/rules.d/20-user-access.rules /etc/sudoers.d/zz-rustdesk-unlock /usr/local/bin/vpn-check
                    /usr/local/sbin/netdev-sync /etc/systemd/system/netdev-sync.service /etc/systemd/system/netdev-sync.path
                    /etc/adduser.conf /etc/NetworkManager/conf.d/zz-wifi-powersave-off.conf
                    /etc/update-manager/release-upgrades /etc/xdg/autostart/update-notifier.desktop
                    /etc/apt/apt.conf.d/20auto-upgrades /etc/apt/apt.conf.d/52custom-unattended-upgrades
                    /etc/systemd/system/apt-daily.timer.d/override.conf /etc/systemd/system/apt-daily-upgrade.timer.d/override.conf
                    /usr/local/lib/app-update-fp.sh /usr/local/sbin/telegram-install-update /usr/local/sbin/app-auto-update
                    /etc/systemd/system/app-auto-update.service /etc/systemd/system/app-auto-update.timer
                    /usr/local/sbin/firmware-auto-update /etc/systemd/system/firmware-auto-update.service
                    /etc/systemd/system/firmware-auto-update.timer /usr/local/bin/update-status
                    /etc/default/excitel-maintenance /usr/local/sbin/excitel-notify /usr/local/bin/ensure-nemo-desktop
                    /etc/xdg/autostart/ensure-nemo-desktop.desktop /etc/apt/apt.conf.d/99ensure-nemo-desktop
                    /usr/local/sbin/excitel-reboot /usr/local/sbin/excitel-after-reboot /usr/local/bin/excitel-login-notice
                    /etc/xdg/autostart/excitel-login-notice.desktop /usr/lib/systemd/system-sleep/excitel-reboot-catchup
                    /etc/systemd/system/excitel-reboot.service /etc/systemd/system/excitel-reboot.timer
                    /etc/systemd/system/excitel-reboot-required.service /etc/systemd/system/excitel-reboot-required.timer
                    /etc/systemd/system/excitel-reboot-catchup.service /etc/systemd/system/excitel-after-reboot.service
                    /usr/local/sbin/excitel-maintenance /usr/local/sbin/excitel-update-notify
                    /etc/systemd/system/excitel-update-notify.service /etc/systemd/system/excitel-update-notify.timer
                    /usr/local/sbin/excitel-logs /etc/systemd/system/excitel-logs.service /etc/systemd/system/excitel-logs.timer
                    /etc/systemd/system/excitel-logs-boot.service /etc/systemd/system/excitel-logs-boot.timer
                    /usr/local/sbin/laptop-logs
                  )
                  UNITS=(zramswap.service earlyoom.service systemd-oomd.service zram-only-swap.service
                         chrome-gpu.timer browser-health.service browser-report-daily.timer
                         rustdesk.service netdev-sync.service netdev-sync.path
                         unattended-upgrades.service apt-daily.timer apt-daily-upgrade.timer
                         app-auto-update.timer firmware-auto-update.timer fwupd-refresh.timer
                         excitel-reboot.timer excitel-reboot-required.timer excitel-after-reboot.service
                         excitel-update-notify.timer excitel-logs.timer excitel-logs-boot.timer)

                  known() { grep -qxF "$1" "$B/created.list" 2>/dev/null || [ -e "$B/files$1" ] || [ -L "$B/files$1" ]; }
                  save() {
                    if [ -f "$B/backup.done" ]; then      # first copy is kept; only items new in this version are added
                      n=0
                      for p in "${PATHS[@]}"; do
                        known "$p" && continue
                        if [ -e "$p" ]; then mkdir -p "$B/files$(dirname "$p")"; cp -a "$p" "$B/files$p"; else echo "$p" >> "$B/created.list"; fi
                        n=$((n+1))
                      done
                      for u in "${UNITS[@]}"; do
                        grep -q "^$u " "$B/units.list" 2>/dev/null && continue
                        st=$(systemctl is-enabled "$u" 2>/dev/null); [ -n "$st" ] || st=absent
                        echo "$u $st" >> "$B/units.list"; n=$((n+1))
                      done
                      if [ "$n" -gt 0 ]; then echo "SAVED $n new items to the backup from $(cat "$B/backup.done")"
                      else echo "backup already exists from $(cat "$B/backup.done") - kept"; fi
                      return 0
                    fi
                    rm -rf "$B"; mkdir -p "$B/files"; chmod 700 "$B"; : > "$B/created.list"; : > "$B/units.list"
                    for p in "${PATHS[@]}"; do
                      if [ -e "$p" ]; then mkdir -p "$B/files$(dirname "$p")"; cp -a "$p" "$B/files$p"
                      else echo "$p" >> "$B/created.list"; fi
                    done
                    for u in "${UNITS[@]}"; do
                      st=$(systemctl is-enabled "$u" 2>/dev/null); [ -n "$st" ] || st=absent
                      echo "$u $st" >> "$B/units.list"
                    done
                    date '+%Y-%m-%d %H:%M:%S' > "$B/backup.done"
                    echo "SAVED backup of the original settings"
                  }

                  restore() {
                    [ -f "$B/backup.done" ] || { echo "NO BACKUP found in $B - nothing to restore"; exit 2; }
                    # 1. switch off services/timers whose unit files the playbook added
                    while read -r p; do
                      case "$p" in
                        /etc/systemd/system/zram-only-swap.service) systemctl disable zram-only-swap.service 2>/dev/null ;;
                        /etc/systemd/system/*) systemctl disable --now "$(basename "$p")" 2>/dev/null ;;
                        /etc/systemd/user/*)   systemctl --global disable "$(basename "$p")" 2>/dev/null ;;
                      esac
                    done < "$B/created.list"
                    # 2. files back as they were; files the playbook added are deleted
                    while read -r p; do [ -n "$p" ] && rm -f "$p" && echo "removed  $p"; done < "$B/created.list"
                    for p in "${PATHS[@]}"; do
                      [ -e "$B/files$p" ] && cp -a "$B/files$p" "$p" && echo "restored $p"
                    done
                    systemctl daemon-reload
                    # 3. services back to their original on/off state
                    while read -r u st; do
                      [ -e "/etc/systemd/system/$u" ] || [ -e "/lib/systemd/system/$u" ] || [ -e "/usr/lib/systemd/system/$u" ] || continue
                      case "$st" in
                        enabled|enabled-runtime|static|alias|indirect|generated)
                          systemctl enable "$u" 2>/dev/null
                          case "$u" in
                            *.timer|*.path|earlyoom.service|browser-health.service|unattended-upgrades.service|rustdesk.service)
                               systemctl restart "$u" 2>/dev/null ;;
                            *) ;;                                                    # boot-time services: take effect at the reboot
                          esac ;;
                        *)
                          case "$u" in
                            zramswap.service|zram-only-swap.service) systemctl disable "$u" 2>/dev/null ;;   # no live swapoff
                            *) systemctl disable --now "$u" 2>/dev/null ;;
                          esac ;;
                      esac
                      echo "service  $u -> $st"
                    done < "$B/units.list"
                    sysctl --system >/dev/null 2>&1
                    [ -f /usr/share/glib-2.0/schemas/org.cinnamon.gschema.xml ] && glib-compile-schemas /usr/share/glib-2.0/schemas 2>/dev/null
                    rm -rf "$B"
                    echo "RESTORED - restart the laptop to finish (zram/swap and memory settings)"
                  }

                  case "${1:-}" in
                    save) save ;;
                    restore) restore ;;
                    *) echo "Usage: browser-slowness-backup save|restore"; exit 1 ;;
                  esac

            - name: Save the original settings (before any change; kept on later runs)
              ansible.builtin.command: /usr/local/sbin/browser-slowness-backup save
              register: r_backup
              changed_when: "'SAVED' in r_backup.stdout"

            # ---------------- 1-3. memory: earlyoom, zram, sysctl, zram-only ----------------
            - name: earlyoom settings (written BEFORE install; Zoom is never closed)
              ansible.builtin.copy:
                dest: /etc/default/earlyoom
                mode: "0644"
                content: !unsafe |
                  EARLYOOM_ARGS="-r 0 -m 5 -s 10 --prefer (^|/)(chrome|code|Viber|tabby|onlyoffice|DesktopEditors)$ --avoid (^|/)(cinnamon|Xorg|Xwayland|systemd|init|sshd|pipewire|wireplumber|lightdm|rustdesk|PacketTracer|AppRun|zoom|ZoomWebviewHost)$"
              register: r_earlyoom_cfg

            - name: zram settings
              ansible.builtin.copy:
                dest: /etc/default/zramswap
                mode: "0644"
                content: |
                  ALGO=zstd
                  PERCENT={{ zram_percent }}
                  PRIORITY=100
              register: r_zram_cfg

            - name: Install zram-tools, earlyoom, libnotify-bin (no other updates)
              ansible.builtin.apt:
                name: [zram-tools, earlyoom, libnotify-bin, python3]
                state: present
                update_cache: true
                cache_valid_time: 3600
                lock_timeout: 600
              register: r_packages

            - name: earlyoom on
              ansible.builtin.systemd:
                name: earlyoom
                enabled: true
                state: "{{ 'restarted' if r_earlyoom_cfg.changed else 'started' }}"

            - name: systemd-oomd off (earlyoom does this job)
              ansible.builtin.systemd:
                name: systemd-oomd
                enabled: false
                state: stopped
              failed_when: false

            - name: zramswap enabled (started fresh at the reboot, never restarted live - a full zram could freeze)
              ansible.builtin.systemd:
                name: zramswap
                enabled: true

            - name: Memory settings for zram
              ansible.builtin.copy:
                dest: /etc/sysctl.d/99-lowram.conf
                mode: "0644"
                content: |
                  vm.swappiness=100
                  vm.vfs_cache_pressure=50
                  vm.page-cluster=0
                  vm.dirty_background_ratio=5
                  vm.dirty_ratio=10
              register: r_sysctl

            - name: Apply memory settings now (safe live)
              ansible.builtin.command: sysctl --system
              changed_when: true
              when: r_sysctl.changed

            - name: zram-only swap setting
              ansible.builtin.copy:
                dest: /etc/default/speedtune
                mode: "0644"
                content: |
                  # yes = when zram is active, turn off disk swap at boot (prevents freezes)
                  ZRAM_ONLY="yes"
              register: r_speedtune

            - name: zram-only swap script
              ansible.builtin.copy:
                dest: /usr/local/sbin/zram-only-swap
                mode: "0755"
                content: !unsafe |
                  #!/bin/bash
                  source /etc/default/speedtune 2>/dev/null
                  [ "${ZRAM_ONLY:-yes}" = "yes" ] || exit 0
                  swapon --noheadings --show=NAME | grep -q '^/dev/zram' || exit 0
                  for s in $(swapon --noheadings --show=NAME); do
                    case "$s" in /dev/zram*) ;; *) swapoff "$s" ;; esac
                  done
                  exit 0
              register: r_zramonly_script

            - name: zram-only swap service
              ansible.builtin.copy:
                dest: /etc/systemd/system/zram-only-swap.service
                mode: "0644"
                content: |
                  [Unit]
                  Description=Use only compressed zram swap (no slow disk swap)
                  After=zramswap.service swap.target
                  Wants=zramswap.service

                  [Service]
                  Type=oneshot
                  ExecStart=/usr/local/sbin/zram-only-swap
                  RemainAfterExit=yes

                  [Install]
                  WantedBy=multi-user.target
              register: r_zramonly_unit

            - name: zram-only swap enabled (runs at next boot)
              ansible.builtin.systemd:
                name: zram-only-swap.service
                enabled: true
                daemon_reload: true

            # ---------------- 4-5. Chrome ----------------
            - name: Chrome policy merge tool
              ansible.builtin.copy:
                dest: /usr/local/sbin/chrome-speed-policy
                mode: "0755"
                content: !unsafe |
                  #!/usr/bin/env python3
                  """chrome-speed-policy: merges the Chrome speed policies into performance.json.
                  Keeps every other policy already in the file (for example an extension list set by the
                  main setup script) and never adds one. Prints CHANGED when the file was rewritten."""
                  import json, os
                  P = "/etc/opt/chrome/policies/managed/performance.json"
                  WANT = {
                      "HighEfficiencyModeEnabled": True,
                      "MemorySaverModeSavings": 2,
                      "BackgroundModeEnabled": False,
                      "NetworkPredictionOptions": 2,
                      "MetricsReportingEnabled": False,
                  }
                  os.makedirs(os.path.dirname(P), exist_ok=True)
                  try:
                      d = json.load(open(P))
                      if not isinstance(d, dict):
                          d = {}
                  except Exception:
                      d = {}
                  new = dict(d)
                  new.update(WANT)
                  new.setdefault("HardwareAccelerationModeEnabled", True)   # chrome-gpu switches this when needed
                  if new != d or not os.path.exists(P):
                      tmp = P + ".tmp"
                      with open(tmp, "w") as f:
                          json.dump(new, f, indent=2)
                          f.write("\n")
                      os.chmod(tmp, 0o644)
                      os.replace(tmp, P)
                      print("CHANGED")

            - name: Chrome speed policies (keeps other policies, adds no extension)
              ansible.builtin.command: /usr/local/sbin/chrome-speed-policy
              register: r_policy
              changed_when: "'CHANGED' in r_policy.stdout"

            - name: chrome-gpu setting (an existing on/off choice is kept)
              ansible.builtin.copy:
                dest: /etc/default/chrome-gpu
                mode: "0644"
                force: false
                content: |
                  # Chrome graphics acceleration: auto | on | off   (change with: sudo chrome-gpu ...)
                  CHROME_GPU="auto"

            - name: chrome-gpu tool
              ansible.builtin.copy:
                dest: /usr/local/sbin/chrome-gpu
                mode: "0755"
                content: !unsafe |
                  #!/bin/bash
                  # chrome-gpu auto    -> on, switched off automatically after an Intel "GPU HANG"
                  # chrome-gpu on|off  -> always on / always off on this laptop
                  # chrome-gpu status  -> show setting, detection result, policy
                  # chrome-gpu apply   -> (boot/hourly) evaluate and write the Chrome policy
                  CONF=/etc/default/chrome-gpu
                  STATE=/var/lib/custom-iso/chrome-gpu.state
                  POLICY=/etc/opt/chrome/policies/managed/performance.json
                  CHROME_GPU="auto"; [ -f "$CONF" ] && . "$CONF"
                  HANG="no"; SINCE=0; [ -f "$STATE" ] && . "$STATE"
                  mkdir -p /var/lib/custom-iso
                  save_state() { printf 'HANG="%s"\nSINCE=%s\n' "$HANG" "$SINCE" > "$STATE"; }
                  detect_hang() {   # Intel graphics driver hangs/resets since SINCE (max. 7 days back)
                    local since=$(( $(date +%s) - 7*86400 )); [ "$SINCE" -gt "$since" ] && since=$SINCE
                    journalctl -k --since "@$since" --no-pager -q 2>/dev/null \
                      | grep -qE '(i915|xe ).*(GPU HANG|Timedout job|Resetting chip|GT[0-9]*: reset)'
                  }
                  write_policy() {  # $1 = true|false
                    [ -f "$POLICY" ] || return 0
                    python3 - "$POLICY" "$1" <<'PY'
                  import json, sys
                  p, val = sys.argv[1], sys.argv[2] == "true"
                  try:
                      d = json.load(open(p))
                  except Exception:
                      d = {}
                  if d.get("HardwareAccelerationModeEnabled") != val:
                      d["HardwareAccelerationModeEnabled"] = val
                      json.dump(d, open(p, "w"), indent=2)
                  PY
                  }
                  case "${1:-apply}" in
                    on|off|auto)
                      [ "$(id -u)" -eq 0 ] || { echo "Run with sudo."; exit 1; }
                      printf '# Chrome graphics acceleration: auto | on | off   (change with: sudo chrome-gpu ...)\nCHROME_GPU="%s"\n' "$1" > "$CONF"
                      CHROME_GPU="$1"
                      if [ "$1" = "auto" ]; then HANG="no"; SINCE=$(date +%s); save_state; fi   # fresh start
                      ;;
                    status)
                      p=$(python3 -c "import json;print(json.load(open('$POLICY')).get('HardwareAccelerationModeEnabled'))" 2>/dev/null)
                      echo "Setting: $CHROME_GPU   GPU hang detected (auto): $HANG   Chrome acceleration now: ${p:-unknown}"
                      exit 0 ;;
                    apply) ;;
                    *) echo "Usage: sudo chrome-gpu auto | on | off | status"; exit 1 ;;
                  esac
                  case "$CHROME_GPU" in
                    on)  write_policy true ;;
                    off) write_policy false ;;
                    *)   if [ "$HANG" != "yes" ] && detect_hang; then HANG="yes"; save_state
                           logger -t chrome-gpu "Intel GPU hang detected - Chrome graphics acceleration switched off"
                         fi
                         [ "$HANG" = "yes" ] && write_policy false || write_policy true ;;
                  esac
                  if [ "${1:-apply}" != "apply" ]; then
                    case "$CHROME_GPU" in on) now=ON ;; off) now=OFF ;; *) [ "$HANG" = "yes" ] && now=OFF || now=ON ;; esac
                    echo "Chrome graphics acceleration: $now (setting: $CHROME_GPU) - takes effect when Chrome is restarted."
                  fi
                  exit 0

            - name: chrome-gpu service and hourly timer
              ansible.builtin.copy:
                dest: "/etc/systemd/system/{{ item.name }}"
                mode: "0644"
                content: "{{ item.content }}"
              loop:
                - name: chrome-gpu.service
                  content: |
                    [Unit]
                    Description=Chrome graphics acceleration (auto: off after an Intel GPU hang)

                    [Service]
                    Type=oneshot
                    ExecStart=/usr/local/sbin/chrome-gpu apply
                    Nice=19
                - name: chrome-gpu.timer
                  content: |
                    [Unit]
                    Description=Check for Intel GPU hangs (Chrome graphics acceleration)

                    [Timer]
                    OnBootSec=2min
                    OnUnitActiveSec=1h

                    [Install]
                    WantedBy=timers.target
              loop_control:
                label: "{{ item.name }}"

            - name: chrome-gpu timer on
              ansible.builtin.systemd:
                name: chrome-gpu.timer
                enabled: true
                state: started
                daemon_reload: true

            - name: chrome-gpu check now
              ansible.builtin.command: /usr/local/sbin/chrome-gpu apply
              changed_when: false

            # ---------------- 6. Cinnamon animations off ----------------
            - name: Is Cinnamon installed?
              ansible.builtin.stat:
                path: /usr/share/glib-2.0/schemas/org.cinnamon.gschema.xml
              register: r_cinnamon

            - name: Animations off for new users (default only, nothing else)
              ansible.builtin.copy:
                dest: /usr/share/glib-2.0/schemas/91-browser-slowness-effects.gschema.override
                mode: "0644"
                content: |
                  [org.cinnamon]
                  desktop-effects-workspace=false
                  desktop-effects-on-dialogs=false
                  desktop-effects-on-menus=false
                  enable-vfade=false
                  startup-animation=false

                  [org.cinnamon.desktop.interface]
                  enable-animations=false
              register: r_schema
              when: r_cinnamon.stat.exists

            - name: Compile desktop defaults (undo the file if it fails)
              ansible.builtin.shell: |
                glib-compile-schemas /usr/share/glib-2.0/schemas && exit 0
                rm -f /usr/share/glib-2.0/schemas/91-browser-slowness-effects.gschema.override
                glib-compile-schemas /usr/share/glib-2.0/schemas
                echo "schema override removed"; exit 1
                
              when: r_cinnamon.stat.exists and r_schema.changed

            - name: Animations-off tool for existing users
              ansible.builtin.copy:
                dest: /usr/local/sbin/cinnamon-effects-off
                mode: "0755"
                content: !unsafe |
                  #!/bin/bash
                  # cinnamon-effects-off            : animations off for every existing desktop user
                  # cinnamon-effects-off --restore  : puts back each user's own values from before the first change
                  # Only animation keys: theme, icons, fonts, wallpaper and clock are never touched.
                  # Prints "CHANGED <user>" / "RESTORED <user>". Original values: /var/lib/browser-slowness-playbook/effects-<user>.orig
                  B=/var/lib/browser-slowness-playbook
                  INNER='c=0
                  while read -r schema key; do
                    [ -n "$schema" ] || continue
                    gsettings writable "$schema" "$key" >/dev/null 2>&1 || continue
                    v=$(gsettings get "$schema" "$key" 2>/dev/null)
                    [ "$v" = "false" ] && continue
                    echo "ORIG $schema $key $v"
                    gsettings set "$schema" "$key" false 2>/dev/null && c=1
                  done <<KEYS
                  org.cinnamon desktop-effects-workspace
                  org.cinnamon desktop-effects-on-dialogs
                  org.cinnamon desktop-effects-on-menus
                  org.cinnamon enable-vfade
                  org.cinnamon startup-animation
                  org.cinnamon.desktop.interface enable-animations
                  KEYS
                  [ "$c" = 1 ] && echo CHANGED
                  exit 0'
                  RESTORE='while read -r schema key value; do
                    [ -n "$schema" ] && gsettings set "$schema" "$key" "$value" 2>/dev/null
                  done; exit 0'
                  as_user() {   # as_user USER UID HOME SCRIPT  (stdin passed through)
                    local bus="/run/user/$2/bus"
                    if [ -S "$bus" ]; then   # logged in: use their own session so the change shows up there
                      runuser -u "$1" -- env HOME="$3" XDG_RUNTIME_DIR="/run/user/$2" DBUS_SESSION_BUS_ADDRESS="unix:path=$bus" bash -c "$4" 2>/dev/null
                    else                     # not logged in: short private session just to write the settings
                      runuser -u "$1" -- env HOME="$3" dbus-run-session -- bash -c "$4" 2>/dev/null
                    fi
                  }
                  cd /
                  getent passwd | while IFS=: read -r u _ uid _ _ home shell; do
                    [ "$uid" -ge 1000 ] 2>/dev/null && [ "$uid" -lt 60000 ] || continue
                    [ -d "$home" ] || continue
                    case "$shell" in */nologin|*/false) continue ;; esac
                    orig="$B/effects-$u.orig"
                    if [ "${1:-}" = "--restore" ]; then
                      [ -f "$orig" ] || continue
                      as_user "$u" "$uid" "$home" "$RESTORE" < "$orig" && rm -f "$orig" && echo "RESTORED $u"
                    else
                      out=$(as_user "$u" "$uid" "$home" "$INNER" < /dev/null)
                      if printf '%s\n' "$out" | grep -qx CHANGED; then
                        if [ ! -f "$orig" ]; then mkdir -p "$B"; printf '%s\n' "$out" | sed -n 's/^ORIG //p' > "$orig"; fi
                        echo "CHANGED $u"
                      fi
                    fi
                  done
                  exit 0
              when: r_cinnamon.stat.exists

            - name: Animations off for existing users
              ansible.builtin.command: /usr/local/sbin/cinnamon-effects-off
              register: r_effects
              changed_when: "'CHANGED' in r_effects.stdout"
              when: r_cinnamon.stat.exists

            # ---------------- 7. Netflix / DRM fix for noexec /home ----------------
            - name: Widevine fix tool
              ansible.builtin.copy:
                dest: /usr/local/bin/widevine-noexec-fix
                mode: "0755"
                content: !unsafe |
                  #!/bin/bash
                  # widevine-noexec-fix: Netflix / Prime / Disney+ error M7702-1003 on laptops with /home mounted noexec.
                  # Chrome loads its newest Widevine (DRM) copy from ~/.config/google-chrome/WidevineCdm, but Linux
                  # refuses to load program code from a noexec /home. Removing Chrome's "hint" file makes Chrome use
                  # the copy it ships in /opt/google/chrome/WidevineCdm instead, which works. Lockdown stays on.
                  # Usage: widevine-noexec-fix [HOME_DIR]   (runs at login and when Chrome updates the hint file)
                  H="${1:-$HOME}"
                  [ -n "$H" ] && [ -d "$H" ] || exit 0
                  findmnt -no OPTIONS -T "$H" 2>/dev/null | tr ',' '\n' | grep -qx noexec || exit 0   # only on noexec /home
                  [ -d /opt/google/chrome/WidevineCdm ] || exit 0                                      # no built-in copy: leave alone
                  hint="$H/.config/google-chrome/WidevineCdm/latest-component-updated-widevine-cdm"
                  [ -e "$hint" ] || exit 0
                  rm -f "$hint" && {
                    logger -t widevine-noexec-fix "removed $hint (/home is noexec): Chrome uses /opt/google/chrome/WidevineCdm"
                    echo "REMOVED $hint"
                  }
                  exit 0

            - name: Widevine fix runs at every login and when Chrome updates Widevine
              ansible.builtin.copy:
                dest: "/etc/systemd/user/{{ item.name }}"
                mode: "0644"
                content: "{{ item.content }}"
              loop:
                - name: widevine-noexec-fix.service
                  content: |
                    [Unit]
                    Description=Netflix/DRM fix: use Chrome's built-in Widevine when /home is noexec

                    [Service]
                    Type=oneshot
                    ExecStart=/usr/local/bin/widevine-noexec-fix

                    [Install]
                    WantedBy=default.target
                - name: widevine-noexec-fix.path
                  content: !unsafe |
                    [Unit]
                    Description=Watch Chrome's Widevine update hint (noexec /home fix)

                    [Path]
                    PathChanged=%h/.config/google-chrome/WidevineCdm/latest-component-updated-widevine-cdm
                    Unit=widevine-noexec-fix.service

                    [Install]
                    WantedBy=default.target
              loop_control:
                label: "{{ item.name }}"
              register: r_widevine_units

            - name: Widevine fix enabled for all users
              ansible.builtin.command: systemctl --global enable widevine-noexec-fix.service widevine-noexec-fix.path
              changed_when: true
              when: r_widevine_units.changed

            - name: Widevine fix now for every user (only acts if /home is noexec)
              ansible.builtin.shell: |
                getent passwd | awk -F: '$3>=1000 && $3<60000 {print $6}' | while read -r h; do
                  [ -d "$h" ] && /usr/local/bin/widevine-noexec-fix "$h"
                done; exit 0
              register: r_widevine_now
              changed_when: "'REMOVED' in r_widevine_now.stdout"

            - name: Is /home noexec?
              ansible.builtin.shell: findmnt -no OPTIONS -T /home | tr ',' '\n' | grep -qx noexec && echo yes || echo no
              register: r_noexec
              changed_when: false
              check_mode: false

            # ---------------- 8. Browser monitor + report ----------------
            - name: Browser monitor (collector)
              ansible.builtin.copy:
                dest: /usr/local/sbin/browser-health-collect
                mode: "0755"
                content: !unsafe |
                  #!/usr/bin/env python3
                  """Browser health collector: samples system + Chrome health every 30 s.
                  Writes /var/log/browser-health/metrics.csv (readable by all users)."""
                  import os, time, glob, subprocess, datetime, sys

                  LOG_DIR = os.environ.get("BH_DIR", "/var/log/browser-health")
                  CSV = os.path.join(LOG_DIR, "metrics.csv")
                  EVENTS = os.path.join(LOG_DIR, "events.log")
                  INTERVAL = int(os.environ.get("BH_INTERVAL", "30"))
                  MAX_LINES = 20160          # 7 days at 30 s
                  HEADER = ("time,mem_avail_mb,mem_total_mb,swap_used_mb,cpu_busy_pct,load1,"
                            "psi_mem,psi_cpu,psi_io,chrome_procs,chrome_mb,top_app,top_app_mb,"
                            "temp_c,cpu_mhz_pct,status,reasons")

                  def read(path, default=""):
                      try:
                          with open(path) as f:
                              return f.read()
                      except Exception:
                          return default

                  def meminfo():
                      m = {}
                      for line in read("/proc/meminfo").splitlines():
                          k, _, v = line.partition(":")
                          try:
                              m[k] = int(v.split()[0])
                          except Exception:
                              pass
                      return m

                  def cpu_times():
                      parts = read("/proc/stat").splitlines()[0].split()[1:]
                      vals = [int(x) for x in parts]
                      idle = vals[3] + (vals[4] if len(vals) > 4 else 0)
                      return idle, sum(vals)

                  def psi(kind):
                      for line in read(f"/proc/pressure/{kind}").splitlines():
                          if line.startswith("some"):
                              for tok in line.split():
                                  if tok.startswith("avg10="):
                                      return float(tok[6:])
                      return 0.0

                  def app_memory():
                      """Memory (PSS, MB) per program name; Chrome processes grouped."""
                      apps = {}
                      chrome_procs = 0
                      for d in glob.glob("/proc/[0-9]*"):
                          comm = read(d + "/comm").strip()
                          if not comm:
                              continue
                          pss = 0
                          for line in read(d + "/smaps_rollup").splitlines():
                              if line.startswith("Pss:"):
                                  pss = int(line.split()[1])
                                  break
                          if pss == 0:
                              continue
                          name = comm
                          if comm.startswith("chrome") or comm == "google-chrome":
                              name = "chrome"
                              chrome_procs += 1
                          apps[name] = apps.get(name, 0) + pss
                      apps_mb = {k: v / 1024 for k, v in apps.items()}
                      return apps_mb, chrome_procs

                  def cpu_temp():
                      best = 0.0
                      pkg = None
                      for z in glob.glob("/sys/class/thermal/thermal_zone*"):
                          t = read(z + "/temp").strip()
                          typ = read(z + "/type").strip()
                          if not t.lstrip("-").isdigit():
                              continue
                          c = int(t) / 1000
                          if "x86_pkg" in typ or "coretemp" in typ:
                              pkg = c
                          best = max(best, c)
                      return pkg if pkg is not None else best

                  def cpu_speed_pct():
                      pcts = []
                      for c in glob.glob("/sys/devices/system/cpu/cpu[0-9]*/cpufreq"):
                          cur, mx = read(c + "/scaling_cur_freq").strip(), read(c + "/cpuinfo_max_freq").strip()
                          if cur.isdigit() and mx.isdigit() and int(mx) > 0:
                              pcts.append(100 * int(cur) / int(mx))
                      return sum(pcts) / len(pcts) if pcts else 100.0

                  def check_earlyoom(seen):
                      try:
                          out = subprocess.run(
                              ["journalctl", "-u", "earlyoom", "--since", "-6min", "-o", "short-iso", "--no-pager", "-q"],
                              capture_output=True, text=True, timeout=10).stdout
                      except Exception:
                          return
                      new = [l for l in out.splitlines() if "sending SIG" in l and l not in seen]
                      if new:
                          with open(EVENTS, "a") as f:
                              for l in new:
                                  f.write(l + "\n")
                                  seen.add(l)
                          os.chmod(EVENTS, 0o644)

                  def trim_csv():
                      try:
                          with open(CSV) as f:
                              lines = f.readlines()
                          if len(lines) > MAX_LINES + 1:
                              with open(CSV, "w") as f:
                                  f.write(lines[0])
                                  f.writelines(lines[-MAX_LINES:])
                      except Exception:
                          pass

                  def main():
                      os.makedirs(LOG_DIR, exist_ok=True)
                      os.chmod(LOG_DIR, 0o755)
                      if not os.path.exists(CSV) or os.path.getsize(CSV) == 0:
                          with open(CSV, "w") as f:
                              f.write(HEADER + "\n")
                      os.chmod(CSV, 0o644)
                      prev = cpu_times()
                      seen = set()
                      cycle = 0
                      once = "--once" in sys.argv
                      while True:
                          if not once:
                              time.sleep(INTERVAL)
                          else:
                              time.sleep(1)
                          cycle += 1
                          cur = cpu_times()
                          dt = cur[1] - prev[1]
                          busy = 100 * (1 - (cur[0] - prev[0]) / dt) if dt > 0 else 0.0
                          prev = cur

                          m = meminfo()
                          total = m.get("MemTotal", 0) / 1024
                          avail = m.get("MemAvailable", 0) / 1024
                          swap_used = (m.get("SwapTotal", 0) - m.get("SwapFree", 0)) / 1024
                          load1 = float(read("/proc/loadavg", "0").split()[0])
                          pm, pc, pi = psi("memory"), psi("cpu"), psi("io")
                          apps, chrome_procs = app_memory()
                          chrome_mb = apps.get("chrome", 0.0)
                          top = max(apps.items(), key=lambda kv: kv[1]) if apps else ("none", 0.0)
                          temp = cpu_temp()
                          speed = cpu_speed_pct()

                          reasons = []
                          if avail < 300: reasons.append("LOW_RAM")
                          if pm > 10: reasons.append("MEM_PRESSURE")
                          if pi > 25: reasons.append("DISK_WAIT")
                          if busy > 90 and pc > 40: reasons.append("CPU_BUSY")
                          if temp >= 90: reasons.append("HOT")
                          if busy > 70 and speed < 50: reasons.append("THROTTLED")
                          if total and chrome_mb > 0.5 * total: reasons.append("CHROME_HEAVY")
                          status = "SLOW" if reasons else "OK"

                          row = [datetime.datetime.now().strftime("%Y-%m-%d %H:%M:%S"),
                                 f"{avail:.0f}", f"{total:.0f}", f"{swap_used:.0f}", f"{busy:.0f}", f"{load1:.2f}",
                                 f"{pm:.1f}", f"{pc:.1f}", f"{pi:.1f}", str(chrome_procs), f"{chrome_mb:.0f}",
                                 top[0].replace(",", " "), f"{top[1]:.0f}", f"{temp:.0f}", f"{speed:.0f}",
                                 status, "|".join(reasons)]
                          with open(CSV, "a") as f:
                              f.write(",".join(row) + "\n")

                          if cycle % 10 == 0 or once:
                              check_earlyoom(seen)
                          if cycle % 100 == 0:
                              trim_csv()
                          if once:
                              break

                  if __name__ == "__main__":
                      main()
              register: r_collect

            - name: browser-report command
              ansible.builtin.copy:
                dest: /usr/local/bin/browser-report
                mode: "0755"
                content: !unsafe |
                  #!/usr/bin/env python3
                  """Browser slowness report.
                  Usage:  browser-report            last 24 hours
                          browser-report 6          last 6 hours
                          browser-report now        current status
                          browser-report 24 --save  (admin/root) save report to /var/log/browser-health/"""
                  import os, sys, csv, glob, datetime, subprocess

                  LOG_DIR = os.environ.get("BH_DIR", "/var/log/browser-health")
                  CSV = os.path.join(LOG_DIR, "metrics.csv")
                  EVENTS = os.path.join(LOG_DIR, "events.log")

                  ADVICE = {
                      "LOW_RAM": "Free RAM ran out. Close unused tabs and heavy apps (Zoom, VS Code, OnlyOffice, Viber). "
                                 "Use WhatsApp/Slack/Meet as Chrome web apps, not separate apps. Adding 4 GB RAM fixes this permanently.",
                      "MEM_PRESSURE": "The system spent time waiting for memory (swapping). Keep fewer apps open at once; "
                                      "in Chrome press Shift+Esc to find and close the heaviest tabs.",
                      "DISK_WAIT": "Programs waited for the disk. On a hard disk (HDD) this is the main cause of freezes - "
                                   "moving to an SSD is the biggest speed upgrade.",
                      "CPU_BUSY": "The CPU was fully busy. Heavy pages, video, or Zoom calls cause this. Check chrome://gpu shows "
                                  "'Hardware accelerated' for video decode, and close background video tabs.",
                      "HOT": "CPU reached 90 C or more. Clean the fan and vents, keep the laptop on a hard surface, "
                             "consider new thermal paste.",
                      "THROTTLED": "CPU slowed itself down while busy (heat or power saving). Plug in the charger, set power "
                                   "mode to Performance, clean the fan.",
                      "CHROME_HEAVY": "Chrome alone used more than half of RAM. Memory Saver is already on Maximum; "
                                      "keep under about 10 tabs and remove unneeded extensions.",
                  }
                  LABEL = {
                      "LOW_RAM": "Low free RAM", "MEM_PRESSURE": "Memory pressure (swapping)",
                      "DISK_WAIT": "Waiting for disk", "CPU_BUSY": "CPU fully busy", "HOT": "CPU overheating",
                      "THROTTLED": "CPU throttled", "CHROME_HEAVY": "Chrome using >50% RAM",
                  }

                  def load_rows(hours):
                      rows = []
                      if not os.path.exists(CSV):
                          return rows
                      since = datetime.datetime.now() - datetime.timedelta(hours=hours)
                      with open(CSV) as f:
                          for r in csv.DictReader(f):
                              try:
                                  t = datetime.datetime.strptime(r["time"], "%Y-%m-%d %H:%M:%S")
                              except Exception:
                                  continue
                              if t >= since:
                                  r["_t"] = t
                                  rows.append(r)
                      return rows

                  def num(r, k):
                      try:
                          return float(r[k])
                      except Exception:
                          return 0.0

                  def system_facts():
                      facts = []
                      root_dev = subprocess.run(["findmnt", "-no", "SOURCE", "/"], capture_output=True, text=True).stdout.strip()
                      disk = "unknown"
                      try:
                          pk = subprocess.run(["lsblk", "-no", "PKNAME", root_dev], capture_output=True, text=True).stdout.split()
                          name = pk[0] if pk else os.path.basename(root_dev)
                          rot = open(f"/sys/block/{name}/queue/rotational").read().strip()
                          disk = "HDD (hard disk - slow)" if rot == "1" else "SSD"
                      except Exception:
                          pass
                      facts.append(("System disk", disk))
                      swaps = subprocess.run(["swapon", "--noheadings", "--show=NAME,SIZE"], capture_output=True, text=True).stdout.split("\n")
                      swaps = [s.split() for s in swaps if s.strip()]
                      facts.append(("Swap", ", ".join(f"{a} {b}" for a, b in swaps) or "none"))
                      facts.append(("Chrome speed policy", "active" if os.path.exists("/etc/opt/chrome/policies/managed/performance.json") else "missing"))
                      eo = subprocess.run(["systemctl", "is-active", "earlyoom"], capture_output=True, text=True).stdout.strip()
                      facts.append(("Freeze protection (earlyoom)", eo or "unknown"))
                      return facts

                  def episodes(rows):
                      eps, cur = [], None
                      for r in rows:
                          if r["status"] == "SLOW":
                              if cur is None:
                                  cur = {"start": r["_t"], "end": r["_t"], "reasons": {}, "min_ram": num(r, "mem_avail_mb"), "top": set()}
                              cur["end"] = r["_t"]
                              for x in filter(None, r["reasons"].split("|")):
                                  cur["reasons"][x] = cur["reasons"].get(x, 0) + 1
                              cur["min_ram"] = min(cur["min_ram"], num(r, "mem_avail_mb"))
                              cur["top"].add(r["top_app"])
                          elif cur:
                              eps.append(cur); cur = None
                      if cur:
                          eps.append(cur)
                      return eps

                  def now_status():
                      if not os.path.exists(CSV):
                          print("No data yet. The browser-health service collects a sample every 30 seconds.")
                          return
                      with open(CSV) as f:
                          rows = list(csv.DictReader(f))
                      if not rows:
                          print("No data yet."); return
                      r = rows[-1]
                      print(f"Status at {r['time']}: {r['status']}")
                      print(f"  Free RAM:        {r['mem_avail_mb']} MB of {r['mem_total_mb']} MB")
                      print(f"  Swap in use:     {r['swap_used_mb']} MB")
                      print(f"  CPU busy:        {r['cpu_busy_pct']} %   speed {r['cpu_mhz_pct']} % of max   temp {r['temp_c']} C")
                      print(f"  Chrome:          {r['chrome_mb']} MB in {r['chrome_procs']} processes")
                      print(f"  Heaviest app:    {r['top_app']} ({r['top_app_mb']} MB)")
                      for x in filter(None, r["reasons"].split("|")):
                          print(f"  ! {LABEL.get(x, x)}")

                  def build_report(hours):
                      rows = load_rows(hours)
                      out = []
                      p = out.append
                      now = datetime.datetime.now()
                      p("=" * 70)
                      p(f" BROWSER SLOWNESS REPORT  -  {os.uname().nodename}")
                      p(f" Period: last {hours} hours   Generated: {now:%Y-%m-%d %H:%M}")
                      p("=" * 70)
                      if not rows:
                          p("\nNo data for this period yet. The service records every 30 seconds.")
                          return "\n".join(out)

                      slow = [r for r in rows if r["status"] == "SLOW"]
                      pct = 100 * len(slow) / len(rows)
                      verdict = ("GOOD - no real slowness" if pct < 2 else
                                 "FAIR - occasional slowness" if pct < 10 else
                                 "POOR - frequent slowness")
                      p(f"\nOVERALL: {verdict}")
                      p(f"  Samples: {len(rows)}   Slow samples: {len(slow)} ({pct:.1f} %)")

                      p("\nSYSTEM")
                      for k, v in system_facts():
                          p(f"  {k:30} {v}")

                      avail = [num(r, "mem_avail_mb") for r in rows]
                      chrome = [num(r, "chrome_mb") for r in rows]
                      p("\nMEMORY AND CPU")
                      p(f"  RAM total:                     {rows[-1]['mem_total_mb']} MB")
                      p(f"  Free RAM average / lowest:     {sum(avail)/len(avail):.0f} MB / {min(avail):.0f} MB")
                      p(f"  Swap used peak:                {max(num(r,'swap_used_mb') for r in rows):.0f} MB")
                      p(f"  Chrome memory average / peak:  {sum(chrome)/len(chrome):.0f} MB / {max(chrome):.0f} MB")
                      p(f"  Chrome processes peak:         {max(int(num(r,'chrome_procs')) for r in rows)}")
                      p(f"  CPU temperature peak:          {max(num(r,'temp_c') for r in rows):.0f} C")

                      counts = {}
                      for r in slow:
                          for x in filter(None, r["reasons"].split("|")):
                              counts[x] = counts.get(x, 0) + 1
                      p("\nCAUSES OF SLOWNESS")
                      if counts:
                          for k, v in sorted(counts.items(), key=lambda kv: -kv[1]):
                              p(f"  {LABEL.get(k,k):32} {v:5} samples ({100*v/len(rows):.1f} % of time)")
                      else:
                          p("  None detected.")

                      peak = {}
                      for r in rows:
                          a, mb = r["top_app"], num(r, "top_app_mb")
                          peak[a] = max(peak.get(a, 0), mb)
                      p("\nHEAVIEST APPS (peak memory when they were the top user)")
                      for a, mb in sorted(peak.items(), key=lambda kv: -kv[1])[:6]:
                          p(f"  {a:20} {mb:6.0f} MB")

                      eps = episodes(rows)
                      p(f"\nSLOW PERIODS ({len(eps)})")
                      if eps:
                          for e in sorted(eps, key=lambda e: e["end"] - e["start"], reverse=True)[:10]:
                              dur = int((e["end"] - e["start"]).total_seconds() // 60) + 1
                              main = max(e["reasons"], key=e["reasons"].get) if e["reasons"] else "?"
                              p(f"  {e['start']:%m-%d %H:%M}  ~{dur:3} min  {LABEL.get(main, main):28} "
                                f"lowest RAM {e['min_ram']:.0f} MB  apps: {', '.join(sorted(e['top']))[:40]}")
                      else:
                          p("  None.")

                      p("\nFREEZE PROTECTION (apps closed by earlyoom to prevent a hang)")
                      since = now - datetime.timedelta(hours=hours)
                      kills = []
                      if os.path.exists(EVENTS):
                          for l in open(EVENTS):
                              try:
                                  t = datetime.datetime.fromisoformat(l.split()[0][:19])
                                  if t >= since:
                                      kills.append(l.strip())
                              except Exception:
                                  pass
                      p("  " + ("\n  ".join(kills[-10:]) if kills else "None - no app had to be closed."))

                      p("\nRECOMMENDATIONS")
                      if not counts:
                          p("  - No action needed. Browser and system are running smoothly.")
                      for k, _ in sorted(counts.items(), key=lambda kv: -kv[1]):
                          p(f"  - {ADVICE.get(k, k)}")
                      p("\nTip: in Chrome press Shift+Esc to see which tab uses the most memory.")
                      return "\n".join(out)

                  def main():
                      args = [a for a in sys.argv[1:] if a != "--save"]
                      if args and args[0] in ("now", "status"):
                          now_status(); return
                      hours = 24
                      if args:
                          try:
                              hours = max(1, int(args[0]))
                          except ValueError:
                              print(__doc__); return
                      text = build_report(hours)
                      print(text)
                      if "--save" in sys.argv:
                          if os.geteuid() != 0:
                              print("\n(--save needs admin: sudo browser-report --save)"); return
                          day = datetime.datetime.now().strftime("%Y-%m-%d")
                          for path in (os.path.join(LOG_DIR, f"report-{day}.txt"), os.path.join(LOG_DIR, "report-latest.txt")):
                              with open(path, "w") as f:
                                  f.write(text + "\n")
                              os.chmod(path, 0o644)
                          old = sorted(glob.glob(os.path.join(LOG_DIR, "report-20*.txt")))[:-14]
                          for o in old:
                              os.remove(o)

                  if __name__ == "__main__":
                      main()

            - name: Monitor service and daily report timer
              ansible.builtin.copy:
                dest: "/etc/systemd/system/{{ item.name }}"
